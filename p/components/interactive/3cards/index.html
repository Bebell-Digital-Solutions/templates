<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive 3-Card Fanned Stack</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 45%, #32184d 0%, #1d0d30 55%, #12071f 100%);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 3D Stage */
    .card-stage {
      position: relative;
      width: 680px;
      height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      cursor: pointer;
    }

    /* Group container that receives global 3D tilt */
    .card-stack {
      position: relative;
      width: 340px;
      height: 214px;
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* Base Card Styling */
    .card {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow:
        0 22px 45px rgba(0, 0, 0, 0.55),
        0 4px 12px rgba(0, 0, 0, 0.35);
      transform-style: preserve-3d;
      will-change: transform;
      background-color: #16161d;
      user-select: none;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    /* Subtle dark vignette + bottom label bar for readability */
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.05) 0%,
        rgba(0, 0, 0, 0.15) 60%,
        rgba(0, 0, 0, 0.55) 100%
      );
      pointer-events: none;
    }

    /* Cursor-tracking specular glare overlay */
    .card-glare {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.35s ease;
      background: radial-gradient(
        circle 240px at var(--glare-x, 50%) var(--glare-y, 50%),
        rgba(255, 255, 255, 0.24),
        rgba(255, 255, 255, 0.06) 45%,
        transparent 75%
      );
      mix-blend-mode: overlay;
    }

    .card-stage:hover .card-glare {
      opacity: 1;
    }

    /* Optional card caption */
    .card-label {
      position: absolute;
      left: 18px;
      bottom: 16px;
      z-index: 3;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }

    /* Z-index layering */
    .card--left {
      z-index: 1;
    }

    .card--right {
      z-index: 2;
    }

    .card--center {
      z-index: 3;
    }
  </style>
</head>
<body>

  <div class="card-stage" id="cardStage">
    <div class="card-stack" id="cardStack">

      <!-- Left Back Card -->
      <div class="card card--left" data-card="left">
        <img src="https://ik.imagekit.io/bebell/PRO%20BUSINESS%20PAGE/assets/demo-banners/37.webp?auto=format&fit=crop&w=800&q=80" alt="Abstract Purple Waves" />
        <div class="card-glare"></div>
        <div class="card-label">Neon Flow</div>
      </div>

      <!-- Right Back Card -->
      <div class="card card--right" data-card="right">
        <img src="https://ik.imagekit.io/bebell/PRO%20BUSINESS%20PAGE/assets/demo-banners/38.webp?auto=format&fit=crop&w=800&q=80" alt="Fluid Gradient Art" />
        <div class="card-glare"></div>
        <div class="card-label">Prism Shift</div>
      </div>

      <!-- Center Front Card -->
      <div class="card card--center" data-card="center">
        <img src="https://ik.imagekit.io/bebell/PRO%20BUSINESS%20PAGE/assets/demo-banners/36.webp?auto=format&fit=crop&w=800&q=80" alt="Vibrant Mesh Gradient" />
        <div class="card-glare"></div>
        <div class="card-label">Aurora Deck</div>
      </div>

    </div>
  </div>

  <script>
    const stage = document.getElementById('cardStage');
    const stack = document.getElementById('cardStack');
    const leftCard = document.querySelector('[data-card="left"]');
    const centerCard = document.querySelector('[data-card="center"]');
    const rightCard = document.querySelector('[data-card="right"]');
    const allCards = [leftCard, centerCard, rightCard];

    // Normalized mouse state (-1 to 1) and hover state
    const target = { x: 0, y: 0, active: 0 };
    const current = { x: 0, y: 0, active: 0 };

    // Smooth linear interpolation helper
    const lerp = (start, end, factor) => start + (end - start) * factor;

    stage.addEventListener('mousemove', (e) => {
      const rect = stage.getBoundingClientRect();
      // Normalize pointer coordinates from -1 to 1 relative to stage center
      const nx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      const ny = ((e.clientY - rect.top) / rect.height) * 2 - 1;

      target.x = Math.max(-1, Math.min(1, nx));
      target.y = Math.max(-1, Math.min(1, ny));
      target.active = 1;

      // Update per-card specular glare coordinates
      allCards.forEach((card) => {
        const cardRect = card.getBoundingClientRect();
        const gx = ((e.clientX - cardRect.left) / cardRect.width) * 100;
        const gy = ((e.clientY - cardRect.top) / cardRect.height) * 100;
        card.style.setProperty('--glare-x', `${gx}%`);
        card.style.setProperty('--glare-y', `${gy}%`);
      });
    });

    stage.addEventListener('mouseleave', () => {
      target.x = 0;
      target.y = 0;
      target.active = 0;
    });

    function animate() {
      // Smoothly interpolate toward target values (weighted spring feel)
      current.x = lerp(current.x, target.x, 0.08);
      current.y = lerp(current.y, target.y, 0.08);
      current.active = lerp(current.active, target.active, 0.07);

      // 1. Global 3D tilt of the entire card stack
      const stackRotateY = current.x * 11;
      const stackRotateX = -current.y * 9;
      stack.style.transform = `rotateX(${stackRotateX}deg) rotateY(${stackRotateY}deg)`;

      // 2. Dynamic fan spread (expands slightly when hovered, tucks in when idle)
      const spread = current.active * 18;

      // 3. Left card: tucked left, rotated CCW, shifts outward more when cursor moves left
      const leftX = -88 - spread + current.x * -14;
      const leftY = 18 + current.y * -8;
      const leftRot = -15 - current.active * 3 + current.x * 2.5;
      leftCard.style.transform = `translate3d(${leftX}px, ${leftY}px, -40px) rotate(${leftRot}deg)`;

      // 4. Right card: tucked right, rotated CW, shifts outward more when cursor moves right
      const rightX = 88 + spread + current.x * -14;
      const rightY = 18 + current.y * -8;
      const rightRot = 15 + current.active * 3 + current.x * 2.5;
      rightCard.style.transform = `translate3d(${rightX}px, ${rightY}px, -40px) rotate(${rightRot}deg)`;

      // 5. Center card: floats in front with subtle parallax counter-shift
      const centerX = current.x * 10;
      const centerY = current.y * 8;
      const centerZ = 20 + current.active * 12;
      centerCard.style.transform = `translate3d(${centerX}px, ${centerY}px, ${centerZ}px)`;

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
