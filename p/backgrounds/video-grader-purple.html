<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Datacore - Video Background</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="relative min-h-screen w-full bg-[#151517] overflow-hidden">

  <!-- ================= 0. GRADED HTML5 VIDEO BACKGROUND ================= -->
  <!-- Applied cinematic color grading using Tailwind filter utilities -->

    autoplay
    loop
    muted
    playsinline
    class="absolute inset-0 w-full h-full min-h-screen object-cover z-0 pointer-events-none filter brightness-[0.65] contrast-[1.1] saturate-[1.2]"
  >
    <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260210_031346_d87182fb-b0af-4273-84d1-c6fd17d6bf0f.mp4" type="video/mp4" />
  </video>

</body>
</html>
