<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rocket Scroll Transition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      overflow-x: hidden;
    }

    /* Tall scroll track to drive the animation */
    .scroll-track {
      height: 350vh;
      position: relative;
    }

    /* Sticky viewport container */
    .sticky-viewport {
      position: sticky;
      top: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Initial "Ship it" text */
    .ship-it-title {
      font-size: clamp(3rem, 6vw, 5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #001633;
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      pointer-events: none;
      transition: opacity 0.1s linear;
    }

    /* Rocket Image Wrapper */
    .rocket-wrapper {
      position: absolute;
      left: 50%;
      top: 53%;
      transform: translate(-50%, -50%);
      z-index: 4;
      width: 120px;  /* Adjust width to fit your image */
      height: 120px; /* Adjust height to fit your image */
      pointer-events: none;
    }

    .rocket-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Dynamic SVG Plume */
    .plume-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    /* Final Revealed Hero Content */
    .final-hero {
      position: absolute;
      z-index: 5;
      text-align: center;
      color: #ffffff;
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .final-hero.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .final-hero h1 {
      font-size: clamp(2.5rem, 5.5vw, 4.5rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.04em;
      margin-bottom: 16px;
    }

    .final-hero p {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 28px;
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      color: #001633;
      padding: 12px 24px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: transform 0.2s ease;
    }

    .cta-btn:hover {
      transform: scale(1.04);
    }
  </style>
</head>
<body>





  <div class="scroll-track" id="scrollTrack">
    <div class="sticky-viewport">
      
      <!-- Initial Text -->
      <div class="ship-it-title" id="shipItText">Ship it</div>

      <!-- Rocket Image File -->
      <div class="rocket-wrapper" id="rocket">
        <img src="https://ik.imagekit.io/bebell/LaunchQuest/icons/rocket-icon-navy.webp?updatedAt=1793769419323" alt="Rocket">
      </div>

      <!-- #001633 Curved Plume Overlay -->
      <svg class="plume-svg" id="plumeSvg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
        <path id="plumePath" fill="#001633" d="M 500 1000 L 500 1000 L 500 1000 Z" />
      </svg>

      <!-- Final Revealed Section -->
      <div class="final-hero" id="finalHero">
        <h1>Your next website<br>starts with a drop</h1>
        <p>Choose a component. Take it somewhere new.</p>
        <button class="cta-btn">
          Browse components <span>&rarr;</span>
        </button>
      </div>

    </div>
  </div>
  
  
  
  
  
  
  

  <script>
    const scrollTrack = document.getElementById('scrollTrack');
    const shipItText = document.getElementById('shipItText');
    const rocket = document.getElementById('rocket');
    const plumePath = document.getElementById('plumePath');
    const finalHero = document.getElementById('finalHero');

    function updateAnimation() {
      const maxScroll = scrollTrack.offsetHeight - window.innerHeight;
      const rawProgress = window.scrollY / maxScroll;
      const p = Math.min(Math.max(rawProgress, 0), 1);

      // 1. Fade out "Ship it" early (0% to 20% scroll)
      const textOpacity = Math.max(0, 1 - p * 5);
      shipItText.style.opacity = textOpacity;

      // 2. Move rocket image up (from 53% viewport height up to -25% off-screen)
      const rocketProgress = Math.min(p / 0.65, 1);
      const rocketY = 53 - rocketProgress * 85; 
      rocket.style.top = `${rocketY}%`;

      // 3. Calculate SVG Plume coordinates (0 to 1000 coordinate space)
      if (p <= 0.01) {
        plumePath.setAttribute('d', 'M 500 1000 L 500 1000 L 500 1000 Z');
      } else {
        // Adjust the "+ 2.5" offset if the tip of the trail needs to sit higher or lower on your image
        const tipY = (rocketY + 2.5) * 10 - (Math.max(0, p - 0.55) * 4500);

        const spread = Math.pow(p, 1.35) * 3200;
        const leftX = 500 - spread;
        const rightX = 500 + spread;

        const ctrlY = Math.min(1000, Math.max(tipY, 920 - Math.pow(p, 1.8) * 1800));

        const d = `
          M 500 ${tipY}
          Q 500 ${ctrlY} ${leftX} 1000
          L ${rightX} 1000
          Q 500 ${ctrlY} 500 ${tipY}
          Z
        `;
        plumePath.setAttribute('d', d.trim());
      }

      // 4. Reveal final hero content once screen is filled with #001633 (p > 0.78)
      if (p > 0.78) {
        finalHero.classList.add('visible');
      } else {
        finalHero.classList.remove('visible');
      }
    }

    window.addEventListener('scroll', () => {
      requestAnimationFrame(updateAnimation);
    }, { passive: true });

    updateAnimation();
  </script>
</body>
</html>
