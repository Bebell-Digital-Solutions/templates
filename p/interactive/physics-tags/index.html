<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAP3 Services</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #fff;
      font-family: 'Manrope', sans-serif;
    }

    canvas {
      display: block;
      touch-action: none; /* prevents scroll/pinch hijacking drags on touch */
    }
  </style>
</head>
<body>

  <!-- 1. Matter.js MUST be loaded before your script -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

  <script>
    // 2. Wait for fonts so measureText + draw use the real Manrope metrics
    document.fonts.ready.then(init);

    function init() {
      const {
        Engine,
        Render,
        World,
        Bodies,
        Mouse,
        MouseConstraint,
        Events
      } = Matter;

      /* ---------- Canvas sizing (with devicePixelRatio) ---------- */
      const DPR = Math.min(window.devicePixelRatio || 1, 2);

      function getSize() {
        return {
          width: window.innerWidth,
          height: window.innerHeight
        };
      }

      let { width, height } = getSize();

      /* ---------- Engine & Renderer ---------- */
      const engine = Engine.create();
      const world = engine.world;

      const render = Render.create({
        element: document.body,
        engine: engine,
        options: {
          width: width,
          height: height,
          wireframes: false,
          background: '#fff',
          pixelRatio: DPR
        }
      });

      Render.run(render);
      Engine.run(engine);

      /* ---------- Walls ---------- */
      const wallThickness = 50;
      const wallOptions = {
        isStatic: true,
        render: { visible: false }
      };

      let walls = [];

      function buildWalls() {
        // Remove old walls
        World.remove(world, walls);

        walls = [
          Bodies.rectangle(width / 2, height + wallThickness / 2, width * 2, wallThickness, wallOptions), // bottom
          Bodies.rectangle(width / 2, -wallThickness / 2, width * 2, wallThickness, wallOptions),          // top
          Bodies.rectangle(-wallThickness / 2, height / 2, wallThickness, height * 2, wallOptions),       // left
          Bodies.rectangle(width + wallThickness / 2, height / 2, wallThickness, height * 2, wallOptions) // right
        ];
        World.add(world, walls);
      }

      buildWalls();

      /* ---------- Data ---------- */
      const services = [
        "Bebell Digital Solutions",
        "El Negocio Digital",
        "Domain Vault",
        "HelpDesk",
        "NFC Technology",
        "Billed",
        "Menús Digitales",
        "Oficinas Digitales",
        "Consultorios Digitales",
        "Tiendas Digitales",
        "Email Marketing",
        "Digital Strategy",
        "Local SEO",
        "Zoho CRM",
        "Webflow Projects"
      ];

      const tagColors = [
        "#14c38e",
        "#0f766e",
        "#1e293b",
        "#065f46",
        "#0369a1",
        "#047857",
        "#374151",
        "#0891b2"
      ];

      /* ---------- Build tag bodies ---------- */
      const shapes = [];

      // Shared measuring canvas (avoids creating one per tag)
      const measureCanvas = document.createElement("canvas");
      const measureCtx = measureCanvas.getContext("2d");

      services.forEach((text, index) => {
        const fontSize = Math.floor(Math.random() * 16) + 18; // 18–33px

        measureCtx.font = `700 ${fontSize}px Manrope`;
        const textWidth = measureCtx.measureText(text).width;

        const paddingX = 50;
        const paddingY = 20;

        const rectWidth = Math.ceil(textWidth + paddingX);
        const rectHeight = Math.ceil(fontSize + paddingY);

        const body = Bodies.rectangle(
          Math.random() * width,
          Math.random() * (height * 0.5), // top half start
          rectWidth,
          rectHeight,
          {
            restitution: 0.8,
            friction: 0.4,
            chamfer: { radius: 15 }
          }
        );

        body.serviceText = text;
        body.color = tagColors[index % tagColors.length];
        body.fontSize = fontSize;
        body.rectWidth = rectWidth;
        body.rectHeight = rectHeight;

        shapes.push(body);
      });

      World.add(world, shapes);

      /* ---------- Mouse interaction ---------- */
      const mouse = Mouse.create(render.canvas);
      const mouseConstraint = MouseConstraint.create(engine, {
        mouse: mouse,
        constraint: {
          stiffness: 0.2,
          render: { visible: false }
        }
      });
      World.add(world, mouseConstraint);

      // Fix the mouse offset on HiDPI canvases
      mouse.pixelRatio = DPR;

      /* ---------- Custom drawing ---------- */
      Events.on(render, 'afterRender', () => {
        const ctx = render.context;

        // Reset transform for consistent DPR drawing
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

        shapes.forEach((body) => {
          const pos = body.position;
          const angle = body.angle;

          ctx.save();
          ctx.translate(pos.x, pos.y);
          ctx.rotate(angle);

          /* ---- Rounded-rect background ---- */
          const radius = 15;
          const w = body.rectWidth;
          const h = body.rectHeight;

          ctx.fillStyle = body.color;
          ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
          ctx.shadowBlur = 8;
          ctx.shadowOffsetY = 2;

          ctx.beginPath();
          ctx.moveTo(-w / 2 + radius, -h / 2);
          ctx.lineTo(w / 2 - radius, -h / 2);
          ctx.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + radius);
          ctx.lineTo(w / 2, h / 2 - radius);
          ctx.quadraticCurveTo(w / 2, h / 2, w / 2 - radius, h / 2);
          ctx.lineTo(-w / 2 + radius, h / 2);
          ctx.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - radius);
          ctx.lineTo(-w / 2, -h / 2 + radius);
          ctx.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + radius, -h / 2);
          ctx.closePath();
          ctx.fill();

          ctx.shadowBlur = 0;
          ctx.shadowOffsetY = 0;

          /* ---- Text ---- */
          ctx.font = `700 ${body.fontSize}px Manrope`;
          ctx.fillStyle = "#ffffff";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(body.serviceText, 0, 0);

          ctx.restore();
        });
      });

      /* ---------- Resize handling (no reload) ---------- */
      let resizeTimeout = null;

      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          const newSize = getSize();
          if (newSize.width === width && newSize.height === height) return;

          width = newSize.width;
          height = newSize.height;

          // Update renderer
          render.options.width = width;
          render.options.height = height;
          render.canvas.width = width * DPR;
          render.canvas.height = height * DPR;
          render.canvas.style.width = width + 'px';
          render.canvas.style.height = height + 'px';

          // Rebuild walls
          buildWalls();

          // Nudge any bodies that are now outside the bounds back inside
          shapes.forEach((body) => {
            const p = body.position;
            const buffer = 100;
            if (p.x < -buffer || p.x > width + buffer || p.y < -buffer || p.y > height + buffer) {
              Matter.Body.setPosition(body, {
                x: Math.min(Math.max(p.x, buffer), width - buffer),
                y: Math.min(Math.max(p.y, buffer), height - buffer)
              });
              Matter.Body.setVelocity(body, { x: 0, y: 0 });
            }
          });
        }, 150);
      });
    }
  </script>
</body>
</html>
