<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scream Theater</title>
  <style>
    :root {
      --title: "Scream Theater";
      --author: "Matt Cannon";
      --contact: "mc@mattcannon.design";
      --description: "Nodding to the iconic Ghostface mask from Scream and packed theaters in the 90's.";
      --keywords: "css mask, radial mask, vignette, movie theater overlay, ghostface, scream mask, youtube embed, autoplay loop, halloween ui";
      --last-modified: "2025-10-14";
      --content-language: "en";
      --generator: "HTML5, CSS3, JavaScript";
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    .container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Video frame — stays inside container */
    .video-frame {
      position: absolute;
      top: 0%;
      left: 0%;
      padding: 0;
      width: 100%;
      height: 80%;
      z-index: 2;
      border-radius: 18px;
      overflow: hidden;
      background: #000;
      -webkit-mask-image: radial-gradient(
        150% 120% at 50% 50%,
        #000 60%,
        rgba(0, 0, 0, 0.85) 75%,
        transparent 100%
      );
      mask-image: radial-gradient(
        120% 120% at 50% 50%,
        #000 60%,
        rgba(0, 0, 0, 0.85) 75%,
        transparent 100%
      );
      /* ensure the iframe is clipped by this box */
      contain: strict;
    }

    /* iframe fills the frame exactly */
    .video-frame iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      /* slight scale to hide YouTube edge UI but keep inside frame */
      transform: scale(1.08);
      transform-origin: center center;
    }

    .video-frame iframe.visible {
      opacity: 1;
    }

    /* top fade overlay */
    .video-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(#000 0 12%, transparent 22%);
      z-index: 3;
      pointer-events: none;
    }

    /* bottom-right black corner */
    .video-frame::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      width: 16%;
      height: 16%;
      background: #000;
      z-index: 3;
      pointer-events: none;
    }

    /* theater overlay */
    .theater {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: url("https://mattcannon.games/codepen/followers/200/theater.png")
        center / contain no-repeat;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="video-frame" data-video-id="aAWsJxG7UVU" data-start="0" data-earlycut="11"></div>
    <div class="theater"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const frame = document.querySelector(".video-frame");
      const id = frame.dataset.videoId;
      if (!id) return;

      const start = Number(frame.dataset.start || 0);
      const earlyCut = Number(frame.dataset.earlycut || 11);

      // Create the iframe with proper params
      const iframe = document.createElement("iframe");
      iframe.id = "yt-embed";
      iframe.allow = "autoplay; encrypted-media; picture-in-picture";
      iframe.allowFullscreen = true;
      iframe.src = `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&controls=0&rel=0&modestbranding=1&playsinline=1&enablejsapi=1&start=${start}&loop=1&playlist=${id}`;
      frame.appendChild(iframe);

      let player = null;
      let loopEnd = null;
      let tickInterval = null;

      function init() {
        // YT.Player replaces #yt-embed with a new iframe, so we need to find it again
        player = new YT.Player("yt-embed", {
          events: {
            onReady: (e) => {
              e.target.mute();
              e.target.seekTo(start, true);
              e.target.playVideo();

              // Reveal the new iframe element
              const newIframe = document.getElementById("yt-embed");
              if (newIframe) newIframe.classList.add("visible");
            },
            onStateChange: (e) => {
              if (e.data === YT.PlayerState.ENDED) {
                e.target.seekTo(start, true);
              }
            }
          }
        });

        // Loop trimming: skip the last `earlyCut` seconds
        tickInterval = setInterval(() => {
          if (!player || typeof player.getDuration !== "function") return;

          if (!loopEnd) {
            const d = player.getDuration();
            if (d > 0) loopEnd = Math.max(start, d - earlyCut);
          }

          if (
            typeof player.getPlayerState === "function" &&
            player.getPlayerState() === YT.PlayerState.PLAYING
          ) {
            const t = player.getCurrentTime();
            if (loopEnd && t >= loopEnd - 0.15) {
              player.seekTo(start, true);
            }
          }
        }, 120);
      }

      // Load the YouTube IFrame API
      if (!(window.YT && window.YT.Player)) {
        const tag = document.createElement("script");
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);
        window.onYouTubeIframeAPIReady = init;
      } else {
        init();
      }

      // Cleanup on unload
      window.addEventListener("beforeunload", () => {
        if (tickInterval) clearInterval(tickInterval);
      });
    });
  </script>
</body>
</html>
