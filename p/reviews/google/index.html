            <button class="w-full bg-[#111827] text-white font-semibold py-3.5 px-6 rounded-xl hover:bg-gray-800 transition-colors duration-200">

        <!-- Right Column: Auto-scrolling Reviews -->
        <div class="relative h-full overflow-hidden bg-white" id="reviewsContainer">
            <!-- Fade overlays for smooth scrolling effect -->
            <div class="absolute top-0 left-0 w-full h-24 bg-gradient-to-b from-white to-transparent z-10 pointer-events-none"></div>
            <div class="absolute bottom-0 left-0 w-full h-24 bg-gradient-to-t from-white to-transparent z-10 pointer-events-none"></div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 px-4 md:px-8 h-full" id="scrollTracks">

              
                <!-- Track 1 (Left) -->
                <div class="flex flex-col gap-6" id="track1">
                    <!-- Cards will be injected here -->
                </div>

              
                <!-- Track 2 (Right) -->
                <div class="flex flex-col gap-6" id="track2">
                    <!-- Cards will be injected here -->
                </div>

              
            </div>
        </div>

                 author: {

            {

                content: "Exceptional products, marked by several distinctive aspects. The staff members...",
                 author: {

                }

        ];

        function createReviewCard(review) {
            let starsHtml = '';
            for (let i = 0; i < 5; i++) {
                if (i < review.rating) {
                    starsHtml += `<svg class="w-4 h-4 fill-gray-800" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>`;
                } else {
                    starsHtml += `<svg class="w-4 h-4 text-gray-300 fill-current" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>`;
                }
            }

            let avatarHtml = '';
            if (review.author.avatar) {
                avatarHtml = `<img src="${review.author.avatar}" alt="${review.author.name}" class="w-10 h-10 rounded-full object-cover">`;
            } else {
                avatarHtml = `<div class="w-10 h-10 rounded-full ${review.author.color} flex items-center justify-center text-white font-semibold">${review.author.initials}</div>`;
            }

            let productHtml = '';
            if (review.product) {
                productHtml = `
                    <div class="mt-4 pt-4 border-t border-gray-100 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <img src="${review.product.image}" alt="${review.product.name}" class="w-10 h-10 rounded-lg object-cover">
                            <div>
                                <p class="text-[10px] font-semibold text-gray-500 uppercase tracking-wider">Purchased</p>
                                <p class="text-sm font-semibold text-gray-900 truncate max-w-[120px]">${review.product.name}</p>
                            </div>
                        </div>
                        <button class="bg-[#111827] text-white text-xs font-semibold py-2 px-4 rounded-lg hover:bg-gray-800 transition">Buy Now</button>
                    </div>
                `;
            }

            return `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col gap-4 transform transition-transform duration-300 hover:-translate-y-1 hover:shadow-md">
                    <div class="flex justify-between items-center">
                        <div class="flex gap-0.5">
                            ${starsHtml}
                        </div>
                        <span class="text-sm text-gray-500">${review.date}</span>
                    </div>
                    
                    <p class="text-gray-700 leading-relaxed text-[15px]">
                        ${review.content}
                    </p>

                    <div class="flex items-center gap-3 mt-auto pt-2">
                        ${avatarHtml}
                        <div>
                            <p class="text-sm font-bold text-gray-900">${review.author.name}</p>
                            ${review.author.verified ? `
                                <div class="flex items-center gap-1 text-gray-500">
                                    <svg class="w-3 h-3 fill-current" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                                    <span class="text-xs">Verified Buyer</span>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                    ${productHtml}
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const track1 = document.getElementById('track1');
            const track2 = document.getElementById('track2');
            
            // Split data into two columns for the tracks
            const col1Data = reviewsData.filter((_, i) => i % 2 === 0);
            const col2Data = reviewsData.filter((_, i) => i % 2 !== 0);

            // Function to populate a track multiple times to create enough content for seamless scrolling
            function populateTrack(track, data) {
                let html = '';
                // Duplicate data to ensure track is taller than container
                for(let i=0; i<3; i++) {
                    data.forEach(review => {
                        html += createReviewCard(review);
                    });
                }
                track.innerHTML = html;
            }

            populateTrack(track1, col1Data);
            populateTrack(track2, col2Data);

            // Setup scrolling animation variables
            let scrollPos1 = 0;
            // Start track 2 halfway to offset the cards visually
            let scrollPos2 = -150; 
            const speed = 0.5; // Pixels per frame

            function animateScroll() {
                scrollPos1 -= speed;
                // Reverse direction for track 2
                scrollPos2 += speed;

                const resetPoint = -(track1.scrollHeight / 3);
                // For track 2 going up, reset when it goes above 0
                const resetPointUp = 0; 
                // We need to know max scroll for upward scrolling reset
                const maxScrollUp = -(track2.scrollHeight / 3);

                if (scrollPos1 <= resetPoint) {
                    scrollPos1 = 0;
                }
                
                if (scrollPos2 >= resetPointUp) {
                    // Reset to the negative position representing the bottom of the first block
                    scrollPos2 = maxScrollUp;
                }

                track1.style.transform = `translateY(${scrollPos1}px)`;
                track2.style.transform = `translateY(${scrollPos2}px)`;

                requestAnimationFrame(animateScroll);
            }

            // Start animation
            requestAnimationFrame(animateScroll);
        });
    </script>
