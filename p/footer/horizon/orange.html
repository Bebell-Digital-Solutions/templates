<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sealos Horizon Eclipse Footer · ember</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #050608;
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ==========================================
           EMBER (#ff5011) ECLIPSE & ATMOSPHERIC GLOW
           ========================================== */
        .eclipse-stage {
            position: relative;
            width: 100%;
            padding-top: 230px; /* Breathing room for upward atmospheric fade into pure black */
            overflow: hidden;
            background: #050608;
        }

        /* Wrapper positioned right along the horizon geometry */
        .horizon-wrapper {
            position: relative;
            width: 100%;
        }

        /* Layer 1: Wide Deep Ember Atmospheric Aura (aura-outer) */
        .aura-outer {
            position: absolute;
            top: -135px;
            left: 50%;
            transform: translateX(-50%);
            width: 220vw;
            height: 290px;
            border-radius: 50%;
            background: radial-gradient(
                50% 50% at 50% 55%,
                rgba(255, 80, 17, 0.52) 0%,
                rgba(204, 58, 10, 0.34) 38%,
                rgba(120, 35, 8, 0.14) 70%,
                rgba(5, 6, 8, 0) 100%
            );
            filter: blur(44px);
            pointer-events: none;
            z-index: 1;
            will-change: transform, opacity, filter;
            animation: auraOuterBreathe 8s ease-in-out infinite;
        }

        /* Layer 2: Concentrated Amber-Ember Core Hotspot (aura-mid) */
        .aura-mid {
            position: absolute;
            top: -78px;
            left: 50%;
            transform: translateX(-50%);
            width: 110vw;
            max-width: 1450px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(
                50% 50% at 50% 58%,
                rgba(255, 190, 150, 0.72) 0%,
                rgba(255, 120, 60, 0.54) 35%,
                rgba(255, 80, 17, 0.24) 70%,
                rgba(5, 6, 8, 0) 100%
            );
            filter: blur(34px);
            pointer-events: none;
            z-index: 2;
            will-change: transform, opacity, filter;
            animation: auraMidPulse 5.5s ease-in-out infinite -1.8s;
        }

        /* Layer 3: Crisp Horizon Rim Light Bleed along the 480vw curvature (aura-core) */
        .aura-core {
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 480vw;
            height: 3800px;
            border-radius: 50%;
            background: radial-gradient(
                28% 8% at 50% 0%,
                rgba(255, 210, 180, 0.88) 0%,
                rgba(255, 140, 90, 0.58) 30%,
                rgba(255, 80, 17, 0.36) 60%,
                rgba(180, 50, 10, 0.14) 82%,
                transparent 100%
            );
            filter: blur(6px);
            pointer-events: none;
            z-index: 3;
            will-change: transform, opacity, filter;
            animation: auraCoreShimmer 4.2s ease-in-out infinite -0.7s;
        }

        /* The Planet / Dark Horizon Mask Shape (Massive 480vw diameter, 3800px height for a gentle, nearly flat arch) */
        .planet-horizon-mask {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 480vw;
            height: 3800px;
            border-radius: 50%;
            background-color: #07080a;
            /* Subtle top rim illumination and upward shadow bloom — ember */
            box-shadow: 
                0 -2px 12px rgba(255, 140, 90, 0.30),
                0 -16px 48px rgba(255, 80, 17, 0.24),
                inset 0 2px 5px rgba(255, 190, 150, 0.15);
            z-index: 4;
            pointer-events: none;
            overflow: hidden;
            animation: horizonRimGlow 5.5s ease-in-out infinite -1.8s;
        }

        /* Inner Surface Reflection: Smoky Ember Light Bleed onto the top center of the footer */
        .planet-horizon-mask::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 18%;
            height: 145px;
            background: radial-gradient(
                50% 95% at 50% 0%,
                rgba(255, 160, 120, 0.24) 0%,
                rgba(255, 110, 60, 0.13) 42%,
                rgba(255, 80, 17, 0.05) 72%,
                rgba(7, 8, 10, 0) 100%
            );
            filter: blur(12px);
            pointer-events: none;
            will-change: transform, opacity, filter;
            animation: surfaceBleedBreathe 5.5s ease-in-out infinite -1.8s;
        }

        /* Secondary subtle edge sheen along the flatter curve — ember tones */
        .planet-horizon-mask::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 32%;
            height: 2px;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 120, 60, 0.25) 20%,
                rgba(255, 190, 150, 0.55) 50%,
                rgba(255, 120, 60, 0.25) 80%,
                transparent 100%
            );
            filter: blur(1px);
            animation: edgeSheenPulse 4.2s ease-in-out infinite -0.7s;
        }

        /* ==========================================
           INFINITE LOOPING LIGHT KEYFRAMES (same motion, ember adjusted)
           ========================================== */
        @keyframes auraOuterBreathe {
            0%, 100% {
                transform: translateX(-50%) scaleX(0.95) scaleY(0.90) translateY(5px);
                opacity: 0.68;
                filter: blur(42px) brightness(0.92);
            }
            50% {
                transform: translateX(-50%) scaleX(1.06) scaleY(1.12) translateY(-7px);
                opacity: 1;
                filter: blur(50px) brightness(1.18);
            }
        }

        @keyframes auraMidPulse {
            0%, 100% {
                transform: translateX(-50%) scaleX(0.92) scaleY(0.88) translateY(4px);
                opacity: 0.72;
                filter: blur(30px) brightness(0.94);
            }
            50% {
                transform: translateX(-50%) scaleX(1.08) scaleY(1.15) translateY(-6px);
                opacity: 1;
                filter: blur(38px) brightness(1.24);
            }
        }

        @keyframes auraCoreShimmer {
            0%, 100% {
                transform: translateX(-50%) translateY(1px);
                opacity: 0.76;
                filter: blur(5px) brightness(0.95);
            }
            50% {
                transform: translateX(-50%) translateY(-2px);
                opacity: 1;
                filter: blur(7px) brightness(1.28);
            }
        }

        @keyframes surfaceBleedBreathe {
            0%, 100% {
                transform: translateX(-50%) scaleX(0.90) scaleY(0.86);
                opacity: 0.65;
                filter: blur(11px) brightness(0.9);
            }
            50% {
                transform: translateX(-50%) scaleX(1.12) scaleY(1.18);
                opacity: 1;
                filter: blur(15px) brightness(1.25);
            }
        }

        @keyframes edgeSheenPulse {
            0%, 100% {
                opacity: 0.65;
                transform: translateX(-50%) scaleX(0.94);
            }
            50% {
                opacity: 1;
                transform: translateX(-50%) scaleX(1.06);
            }
        }

        @keyframes horizonRimGlow {
            0%, 100% {
                box-shadow: 
                    0 -2px 10px rgba(255, 140, 90, 0.22),
                    0 -14px 40px rgba(255, 80, 17, 0.18),
                    inset 0 2px 4px rgba(255, 190, 150, 0.12);
            }
            50% {
                box-shadow: 
                    0 -3px 16px rgba(255, 190, 150, 0.42),
                    0 -22px 60px rgba(255, 80, 17, 0.34),
                    inset 0 2px 7px rgba(255, 210, 180, 0.24);
            }
        }
    </style>
</head>
