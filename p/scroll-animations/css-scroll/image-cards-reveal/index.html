<!DOCTYPE html>
<html>
<head>
  <link href='https://fonts.googleapis.com/css?family=Playfair Display SC' rel='stylesheet'>
  <link rel="stylesheet" href="https://unpkg.com/open-props"/>
  <link rel="stylesheet" href="https://unpkg.com/open-props/normalize.min.css"/>

<style>
@property --card-rotation-progress {
  syntax: "<number>";
  inherits: true;
  initial-value: 0;
}

@property --radial-progress {
  syntax: "<number>";
  inherits: true;
  initial-value: 0;
}

body {
  min-height: 200vh;
  padding-top: 50vh;
  background-color: var(--gray-0);
}

:where(h3) {
  margin-block-end: var(--size-3);
}

.container {
  max-width: 80rem;
  padding-inline: var(--size-5);
  margin-block: 2rem;
  margin-inline: auto;
}

.grid-center {
  display: grid;
  place-items: center;
}

.section {
  container-type: inline-size;
  position: relative;
}

/* CTA Button Styling */
.cta-button {
  display: inline-block;
  margin-top: var(--size-4);
  padding: var(--size-3) var(--size-6);
  background-color: var(--blue-7);
  color: var(--gray-0);
  text-decoration: none;
  font-weight: var(--font-weight-7);
  border-radius: var(--radius-round);
  box-shadow: var(--shadow-2);
  transition: transform 0.2s ease, background-color 0.2s ease;
}

.cta-button:hover {
  background-color: var(--blue-9);
  transform: translateY(-2px);
}

.panel {
  box-shadow: var(--shadow-3);
  background: var(--gray-1);
  border-radius: var(--radius-3);
  color: var(--gray-8);
  margin: 0 auto;
  max-width: 980px;
}

.panel__content {
  padding: var(--size-fluid-4);
  z-index: 999;
}

.split-h {
  display: grid;
  gap: 1rem;
  
  
  

  @container (width > 48.7rem) {
    grid-template-columns: repeat(2, 1fr);
  }
}



.cards {
  container-type: inline-size;
  position: relative;
  height: 50vh;
  width: min(100%, 350px);
  clip-path: polygon(-50% -50%, 400% -50%, 150% 100%, -80% 100%);
  margin-inline: auto;
  margin-block-start: -20%;
}




.card {
  --count: 4;
  --angle-min: -45;
  --angle-max: 45;
  --angle-diff: calc(var(--angle-max) - var(--angle-min));
  --angle-step: calc(var(--angle-diff) / (var(--count) + 1));
  --angle: calc(var(--angle-min) + var(--angle-step) * var(--index));
  --angle-deg: calc((var(--angle) * var(--card-rotation-progress)) * 1deg);

  width: 100%;
  position: absolute;
  transform-origin: bottom center;
  rotate: var(--angle-deg);
  translate: 0 50%;

  animation: cardUp 1ms ease-out both, cardRotate 1ms ease-out forwards;
  animation-timeline: view(block);
  animation-range: entry 100% contain 50%;
  
  /* Added overflow hidden to keep the image and overlay contained within the rounded borders */
  border-radius: var(--radius-3);
  overflow: hidden;
  box-shadow: var(--shadow-3);
  border: 4px solid var(--gray-0);
}



.card:nth-child(1) { --index: 1; }
.card:nth-child(2) { --index: 2; }
.card:nth-child(3) { --index: 3; }
.card:nth-child(4) { --index: 4; }



img.demo-image {
  display: block;
  width: 100%;
  aspect-ratio: 1/1.5;
  object-fit: cover;
  background: var(--blue-1);
}



/* New overlay text styles ensuring it sits perfectly on top of the image */
.card__overlay {
  position: absolute;
  inset: auto 0 0 0; /* Pins it to the bottom */
  padding: var(--size-4) var(--size-3) var(--size-3);
  background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
  color: white;
  text-align: center;
  font-weight: var(--font-weight-7);
  font-size: var(--font-size-3);
  z-index: 10;
}

@keyframes cardUp {
  from { translate: 0 80%; }
  to { translate: 0 20%; }
}

@keyframes cardRotate {
  from { --card-rotation-progress: 0; }
  to { --card-rotation-progress: 1; }
}

</style>
</head>
<body>
    <section class="section panel">
      <div class="split-h">
        <div class="grid-center">
          <div class="panel__content">
            <h3>Enrich your product page</h3>
            <p>
              Look at those cards. They animate in from the bottom and with
              some magic they also rotate. Isn't that amazing? With some
              fancy clip-path it should not overflow the bottom.
            </p>
            <!-- CTA Button Added Here -->
            <a href="#" class="cta-button">Explore Features</a>
          </div>
        </div>

        <div>
          <div class="cards">
            <!-- Overlay text added beneath the image in the DOM so it renders on top -->
            <div class="card">
              <img class="demo-image" src="https://images.unsplash.com/photo-1512314889357-e157c22f938d?q=80&w=400&auto=format&fit=crop" alt="Demo Notebook">
              <div class="card__overlay">Notebooks</div>
            </div>
            <div class="card">
              <img class="demo-image" src="https://images.unsplash.com/photo-1534670007418-fbb7f6cf32c3?q=80&w=400&auto=format&fit=crop" alt="Demo Typography">
              <div class="card__overlay">Typography</div>
            </div>
            <div class="card">
              <img class="demo-image" src="https://images.unsplash.com/photo-1505909182942-e2f09aee3e89?q=80&w=400&auto=format&fit=crop" alt="Demo Geometry">
              <div class="card__overlay">Geometry</div>
            </div>
            <div class="card">
              <img class="demo-image" src="https://images.unsplash.com/photo-1512295767273-ac109ac3acfa?q=80&w=400&auto=format&fit=crop" alt="Demo Workspace">
              <div class="card__overlay">Workspaces</div>
            </div>
          </div>
        </div>
      </div>
    </section>
</body>
</html>
