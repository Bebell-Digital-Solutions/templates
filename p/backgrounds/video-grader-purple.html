<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Purple Video Background</title>
  
<link rel="icon" href="https://ik.imagekit.io/bebell/PRO%20BUSINESS%20PAGE/Branding/Pro-Business-Page-favicon.webp">

<!-- === PRIMARY / SEO === -->
<title>{{Page Title}} | {{Brand Name}}</title>
<meta name="description" content="{{Page description — 150-160 chars}}">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="canonical" href="{{https://getdomainvault.com/page-path}}">
<meta name="theme-color" content="{{#0B1220}}">

<!-- === OPEN GRAPH / FACEBOOK === -->
<meta property="og:type" content="website">
<meta property="og:url" content="{{https://getdomainvault.com/page-path}}">
<meta property="og:title" content="{{Page Title | Brand Name}}">
<meta property="og:description" content="{{Page description — mirrors meta description}}">
<meta property="og:image" content="https://ik.imagekit.io/bebell/PRO%20BUSINESS%20PAGE/socialshare-banners/video-grader-purple.webp">
<meta property="og:image:secure_url" content="https://ik.imagekit.io/bebell/PRO%20BUSINESS%20PAGE/socialshare-banners/video-grader-purple.webp">
<meta property="og:image:type" content="image/webp">
<meta property="og:image:alt" content="{{Domain Vault — Secure Domain Portfolio Command Center}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:site_name" content="{{Domain Vault}}">
<meta property="og:locale" content="en_US">
<meta property="og:locale:alternate" content="es_ES">
<meta property="fb:app_id" content="{{1535688258297612}}">

<!-- === TWITTER / X CARD === -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="{{@domainvault}}">
<meta name="twitter:creator" content="{{@domainvault}}">
<meta name="twitter:url" content="{{https://getdomainvault.com/page-path}}">
<meta name="twitter:title" content="{{Page Title | Brand Name}}">
<meta name="twitter:description" content="{{Page description}}">
<meta name="twitter:image" content="https://ik.imagekit.io/bebell/PRO%20BUSINESS%20PAGE/socialshare-banners/video-grader-purple.webp">
<meta name="twitter:image:alt" content="{{Domain Vault — Secure Domain Portfolio Command Center}}">

<!-- === OPTIONAL: STRUCTURED DATA (JSON-LD) === -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{Domain Vault}}",
  "url": "{{https://getdomainvault.com}}",
  "description": "{{Site-wide description}}",
  "publisher": {
    "@type": "Organization",
    "name": "{{Domain Vault}}",
    "logo": {
      "@type": "ImageObject",
      "url": "{{https://ik.imagekit.io/bebell/Domain%20Vault/image-assets/logo.webp}}"
    }
  }
}
</script>
    


  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="relative min-h-screen w-full bg-[#151517] overflow-hidden">

  <!-- ================= 0. GRADED HTML5 VIDEO BACKGROUND ================= -->
  <!-- Applied cinematic color grading using Tailwind filter utilities -->
  <video
    autoplay
    loop
    muted
    playsinline
    class="absolute inset-0 w-full h-full min-h-screen object-cover z-0 pointer-events-none filter brightness-[0.65] contrast-[1.1] saturate-[1.2]"
  >
    <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260210_031346_d87182fb-b0af-4273-84d1-c6fd17d6bf0f.mp4" type="video/mp4" />
  </video>

</body>
</html>
