<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curved Screen Hero Section</title>
  
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  
  
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  
  
  
  <style>
    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      background: #fdf5f0; 
      color: #111;
      overflow-x: hidden;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 4rem 1rem 2rem;
      box-sizing: border-box;
      position: relative;
    }
    
    

    .hero-content {
      text-align: center;
      max-width: 800px;
      margin-bottom: 2rem;
      z-index: 10;
    }
    
    

    /* Pill-shaped eyebrow */
    .eyebrow {
      display: inline-block;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #d13b3b;
      background: rgba(209, 59, 59, 0.1);
      padding: 0.5rem 1.25rem;
      border-radius: 50px;
      margin-bottom: 1.5rem;
      font-size: 0.75rem;
      border: 1px solid rgba(209, 59, 59, 0.2);
    }
    
    
    
    

    .title {
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 800;
      margin: 0 0 1rem;
      line-height: 1.1;
      letter-spacing: -1px;
    }




    .subtitle {
      font-size: 1.25rem;
      color: #555;
      margin: 0 auto 2rem;
      max-width: 600px;
      line-height: 1.5;
    }
    
    
    

    .cta-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 0px;
      padding-bottom: 0px;
    }
    
    

    .btn {
      padding: 0.875rem 2rem;
      border-radius: 50px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }




    .btn-primary {
      background: #111;
      color: #fff;
    }
    
    

    .btn-primary:hover {
      background: #333;
      transform: translateY(-2px);
    }




    .btn-secondary {
      background: transparent;
      color: #111;
      border: 2px solid #111;
    }
    
    

    .btn-secondary:hover {
      background: #111;
      color: #fff;
      transform: translateY(-2px);
    }
    
    
    

    .scene {
      width: 100vw;
      height: 450px; 
      display: grid;
      place-items: center;
      perspective: 2000px; 
      -webkit-mask: linear-gradient(90deg, transparent 0%, #000 15%, #000 85%, transparent 100%);
      mask: linear-gradient(90deg, transparent 0%, #000 15%, #000 85%, transparent 100%);
    }
    
    
    
    

    .a3d {
      position: relative;
      width: 300px;  
      height: 400px; 
      transform-style: preserve-3d;
    }
    
    
    

    .img-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d; 
    }




    .card {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px; 
      backface-visibility: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
      will-change: transform;
    }
    
    
    

    .social-proof {
      text-align: center;
      margin-top: 0rem;
      z-index: 10;
    }
    
    
    
    

    .social-proof p {
      font-size: 0.875rem;
      color: #888;
      margin-bottom: 1.25rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .logos {
      display: flex;
      gap: 3rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      opacity: 0.5;
      font-weight: 800;
      font-size: 1.25rem;
      color: #111;
    }
  </style>
</head>
<body>

  <header class="hero">
    
    <div class="hero-content">
    
    
      <div class="eyebrow">Immersive Experiences</div>
      
      
      <h1 class="title">The Next Dimension <br> of Web Design</h1>
      
      
      <p class="subtitle">Showcase your best work with stunning 3D curved screen carousels powered by GSAP.</p>
      
      
      <div class="cta-group">
      
      
        <a href="#" class="btn btn-primary">Start Building</a>
        
        
        <a href="#" class="btn btn-secondary">View Demos</a>
        
        
      </div>
    </div>

    <div class="scene">
      <div class="a3d">
      
      
      
      
        <div class="img-container"><img class="card" src="https://images.unsplash.com/photo-1540968221243-29f5d70540bf?w=600&fit=crop" alt="Jelly 1"></div>
        
        
        
        
        
        <div class="img-container"><img class="card" src="https://images.unsplash.com/photo-1596135187959-562c650d98bc?w=600&fit=crop" alt="Jelly 2"></div>
        
        
        
        
        
        <div class="img-container"><img class="card" src="https://images.unsplash.com/photo-1628944682084-831f35256163?w=600&fit=crop" alt="Jelly 3"></div>
        
        
        
        
        
        <div class="img-container"><img class="card" src="https://images.unsplash.com/photo-1590013330451-3946e83e0392?w=600&fit=crop" alt="Jelly 4"></div>
        
        
        
        
        
        <div class="img-container"><img class="card" src="https://images.unsplash.com/photo-1590421959604-741d0eec0a2e?w=600&fit=crop" alt="Jelly 5"></div>
        
        
        
        
        
        <div class="img-container"><img class="card" src="https://images.unsplash.com/photo-1572613000712-eadc57acbecd?w=600&fit=crop" alt="Jelly 6"></div>
        
        
        
        
        
        <div class="img-container"><img class="card" src="https://images.unsplash.com/photo-1570097192570-4b49a6736f9f?w=600&fit=crop" alt="Jelly 7"></div>
        
        
        
        
        
        <div class="img-container"><img class="card" src="https://images.unsplash.com/photo-1620789550663-2b10e0080354?w=600&fit=crop" alt="Jelly 8"></div>
        
        
        
        
        
        <div class="img-container"><img class="card" src="https://images.unsplash.com/photo-1617775623669-20bff4ffaa5c?w=600&fit=crop" alt="Jelly 9"></div>
        
        
        
        
        <div class="img-container"><img class="card" src="https://images.unsplash.com/photo-1548600916-dc8492f8e845?w=600&fit=crop" alt="Jelly 10"></div>
        
        
        
        
        <div class="img-container"><img class="card" src="https://images.unsplash.com/photo-1573824969595-a76d4365a2e6?w=600&fit=crop" alt="Jelly 11"></div>
        
        
        
        
        <div class="img-container"><img class="card" src="https://images.unsplash.com/photo-1633936929709-59991b5fdd72?w=600&fit=crop" alt="Jelly 12"></div>
      </div>
    </div>
    
    
    
    
    
    

    <div class="social-proof">
      <p>Trusted by innovative teams worldwide</p>
      <div class="logos">
        <span>ACME Corp</span>
        <span>GlobalTech</span>
        <span>Stark Ind.</span>
        <span>Wayne Ent.</span>
      </div>
    </div>

  </header>
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      
      // 1. Hero Content Reveal Animation (Zoom + Fade In)
      gsap.from(".hero-content > *", {
        opacity: 0,
        scale: 0.8,
        y: 20,
        duration: 1,
        stagger: 0.15,
        ease: "back.out(1.5)"
      });

      // 2. Setup 3D Carousel
      const containers = document.querySelectorAll('.img-container');
      const N = containers.length; 
      const angle = 360 / N;      
      const cardWidth = 320; 
      const gap = 20; 
      const radius = Math.round((cardWidth / 2 + gap) / Math.tan(Math.PI / N));

      gsap.set('.a3d', { z: -400 });

      containers.forEach((container, i) => {
        gsap.set(container, {
          rotationY: i * angle
        });
        
        const img = container.querySelector('.card');
        gsap.set(img, {
          z: -radius
        });
      });

      // 3. Play 3D Carousel Animation
      gsap.to('.a3d', {
        rotationY: -360, 
        duration: 35,    
        ease: "none",    
        repeat: -1       
      });
      
    });
  </script>
</body>
</html>
