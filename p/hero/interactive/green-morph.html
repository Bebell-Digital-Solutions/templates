<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Datacore - Fluid Aurora</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=Manrope:wght@400;500;600;700&display=swap');

    .font-manrope { font-family: 'Manrope', sans-serif; }
    .font-cabin { font-family: 'Cabin', sans-serif; }
    .font-instrument { font-family: 'Instrument Serif', serif; }
    .font-inter { font-family: 'Inter', sans-serif; }

    .glass-pill {
      background: rgba(58, 71, 40, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(167, 218, 50, 0.45);
    }

    .ambient-hero-glow {
      background: radial-gradient(circle at 50% 45%, rgba(167, 218, 50, 0.22) 0%, rgba(167, 218, 50, 0) 70%);
    }

    /* Modal / Menu Animations */
    .fade-in { animation: fadeIn 0.2s ease-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    body { background-color: #151517; }
  </style>
</head>
<body class="text-white selection:bg-[#a7da32] selection:text-[#151517] overflow-x-hidden">

  <div class="relative min-h-screen w-full">
    
    <!-- BACKGROUND SYSTEM -->
    <div class="absolute inset-0 w-full h-full min-h-screen overflow-hidden z-0 pointer-events-none">
      <!-- Interactive Canvas -->
      <canvas id="aurora-canvas" class="absolute inset-0 w-full h-full opacity-100"></canvas>
      <!-- Ambient Glow -->
      <div class="ambient-hero-glow absolute inset-0 pointer-events-none"></div>
      <div class="absolute inset-0 bg-gradient-to-t from-[#151517] via-transparent to-transparent opacity-60"></div>
    </div>

    <!-- NAVBAR -->
    <header class="relative z-20 w-full bg-transparent px-6 lg:px-[120px] py-[16px]">
      <div class="max-w-[1440px] mx-auto flex items-center justify-between">
        <div class="flex items-center gap-10 xl:gap-14">
          <!-- Logo -->
          <a href="#" class="flex items-center gap-2.5 group focus:outline-none">
            <svg width="132" height="28" viewBox="0 0 132 28" fill="none" xmlns="http://www.w3.org/2000/svg" class="transition-transform duration-300 group-hover:scale-[1.02]">
              <path d="M1.04356 6.35771L13.6437 0.666504C14.1892 0.42012 14.8108 0.42012 15.3563 0.666504L27.9564 6.35771C28.7654 6.72311 29.2857 7.52842 29.2857 8.4162V19.5838C29.2857 20.4716 28.7654 21.2769 27.9564 21.6423L15.3563 27.3335C14.8108 27.5799 14.1892 27.5799 13.6437 27.3335L1.04356 21.6423C0.234582 21.2769 -0.285714 20.4716 -0.285714 19.5838V8.4162C-0.285714 7.52842 0.234582 6.72311 1.04356 6.35771ZM14.5 4.25L4.75 8.65V19.35L14.5 23.75L24.25 19.35V8.65L14.5 4.25Z" fill="#FFFFFF"/>
              <path d="M14.5 8.5L20.5 11.2V16.8L14.5 19.5L8.5 16.8V11.2L14.5 8.5Z" fill="#a7da32"/>
              <text x="38" y="19.5" fill="#FFFFFF" class="font-manrope" font-weight="700" font-size="17" letter-spacing="-0.03em">DATACORE</text>
            </svg>
          </a>

          <!-- Desktop Nav -->
          <nav class="hidden lg:flex items-center gap-8 font-manrope font-medium text-[14px] text-white">
            <a href="#" class="hover:opacity-80 transition-opacity py-1">Home</a>
            <div class="relative" id="services-dropdown-container">
              <button id="services-btn" class="flex items-center gap-1.5 hover:opacity-80 transition-opacity py-1 focus:outline-none">
                <span>Services</span>
                <i data-lucide="chevron-down" id="services-chevron" class="w-4 h-4 transition-transform duration-200"></i>
              </button>
              
              <!-- Dropdown Menu -->
              <div id="services-menu" class="hidden absolute left-0 mt-3 w-80 rounded-[12px] glass-pill bg-[#151517]/90 p-2.5 shadow-2xl z-30 fade-in">
                <div class="px-3 py-1.5 text-[11px] font-cabin uppercase tracking-wider text-[#a7da32]">
                  Datacore Hospitality Suite
                </div>
                <div class="space-y-1 mt-1">
                  <button class="w-full flex items-start gap-3 p-2.5 rounded-[8px] hover:bg-[#2b3a1e]/70 transition-colors text-left group">
                    <div class="p-2 rounded-[8px] bg-[#2b3a1e] text-[#a7da32] group-hover:bg-[#a7da32] group-hover:text-[#151517] transition-colors mt-0.5">
                      <i data-lucide="building-2" class="w-4 h-4"></i>
                    </div>
                    <div class="flex-1">
                      <div class="flex items-center gap-2">
                        <span class="font-manrope font-semibold text-[13px] text-white">Instant Resort Booking</span>
                        <span class="px-1.5 py-0.5 text-[10px] font-cabin font-semibold rounded bg-[#a7da32] text-[#151517]">Popular</span>
                      </div>
                      <p class="font-inter text-[12px] text-white/70 mt-0.5 leading-snug">Real-time availability across 14,000+ luxury stays</p>
                    </div>
                  </button>
                  <button class="w-full flex items-start gap-3 p-2.5 rounded-[8px] hover:bg-[#2b3a1e]/70 transition-colors text-left group">
                    <div class="p-2 rounded-[8px] bg-[#2b3a1e] text-[#a7da32] group-hover:bg-[#a7da32] group-hover:text-[#151517] transition-colors mt-0.5">
                      <i data-lucide="compass" class="w-4 h-4"></i>
                    </div>
                    <div class="flex-1">
                      <div class="flex items-center gap-2">
                        <span class="font-manrope font-semibold text-[13px] text-white">Curated Itineraries</span>
                        <span class="px-1.5 py-0.5 text-[10px] font-cabin font-semibold rounded bg-[#a7da32] text-[#151517]">New</span>
                      </div>
                      <p class="font-inter text-[12px] text-white/70 mt-0.5 leading-snug">AI-assisted travel planning synced with Datacore</p>
                    </div>
                  </button>
                </div>
              </div>
            </div>
            <a href="#" class="hover:opacity-80 transition-opacity py-1">Reviews</a>
            <a href="#" class="hover:opacity-80 transition-opacity py-1">Contact us</a>
          </nav>
        </div>

        <div class="hidden lg:flex items-center gap-3">
          <button class="font-manrope font-semibold text-[14px] bg-white text-[#171717] border border-[#d4d4d4] rounded-[8px] px-4 py-2.5 hover:bg-[#f6f7f9] active:scale-[0.99] transition-all">
            Sign In
          </button>
          <button class="font-manrope font-semibold text-[14px] bg-[#a7da32] hover:bg-[#b9e754] text-[#151517] rounded-[8px] px-4 py-2.5 shadow-[0_4px_20px_rgba(167,218,50,0.25)] active:scale-[0.99] transition-all">
            Get Started
          </button>
        </div>
      </div>
    </header>

    <!-- HERO CONTENT -->
    <main class="relative z-10 flex flex-col items-center text-center px-6 mt-24 sm:mt-32 pb-20 max-w-[1140px] mx-auto">
      <button class="glass-pill h-[38px] rounded-[10px] px-3 inline-flex items-center gap-2.5 font-cabin font-medium text-[14px] text-white hover:border-[#b9e754] transition-all duration-200 group cursor-pointer shadow-[0_4px_20px_rgba(43,58,30,0.4)]">
        <span class="bg-[#a7da32] text-[#151517] font-cabin font-semibold text-[12px] leading-none px-2 py-1 rounded-[6px] tracking-tight">New</span>
        <span class="tracking-wide">Say Hello to Datacore v3.2</span>
        <i data-lucide="arrow-right" class="w-3.5 h-3.5 text-[#a7da32] transition-transform duration-200 group-hover:translate-x-0.5"></i>
      </button>

      <h1 class="font-instrument text-white text-5xl sm:text-7xl lg:text-[96px] leading-[1.1] tracking-tight mt-7 max-w-[980px] drop-shadow-sm">
        Book your perfect stay instantly <span class="italic font-normal px-1.5 sm:px-2 inline-block text-white">and</span> hassle-free
      </h1>

      <p class="font-inter font-normal text-[18px] text-white/70 max-w-[662px] mt-6 leading-relaxed">
        Discover handpicked hotels, resorts, and stays across your favorite destinations. Enjoy exclusive deals, fast booking, and 24/7 support.
      </p>

      <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mt-10 w-full sm:w-auto">
        <button class="w-full sm:w-auto font-cabin font-medium text-[16px] bg-[#a7da32] hover:bg-[#b9e754] text-[#151517] rounded-[10px] px-7 py-3.5 shadow-[0_4px_24px_rgba(167,218,50,0.35)] hover:shadow-[0_6px_30px_rgba(185,231,84,0.5)] active:scale-[0.99] transition-all cursor-pointer">
          Book a Free Demo
        </button>
        <button class="w-full sm:w-auto font-cabin font-medium text-[16px] bg-[#2b3a1e] hover:bg-[#384a24] text-[#f6f7f9] rounded-[10px] px-7 py-3.5 border border-[#a7da32]/35 active:scale-[0.99] transition-all cursor-pointer shadow-lg">
          Get Started Now
        </button>
      </div>
    </main>
  </div>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Dropdown Logic
    const servicesBtn = document.getElementById('services-btn');
    const servicesMenu = document.getElementById('services-menu');
    const servicesChevron = document.getElementById('services-chevron');
    let dropdownOpen = false;

    servicesBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownOpen = !dropdownOpen;
      if (dropdownOpen) {
        servicesMenu.classList.remove('hidden');
        servicesChevron.classList.add('rotate-180', 'text-[#a7da32]');
      } else {
        servicesMenu.classList.add('hidden');
        servicesChevron.classList.remove('rotate-180', 'text-[#a7da32]');
      }
    });

    document.addEventListener('click', (e) => {
      if (!servicesBtn.contains(e.target) && !servicesMenu.contains(e.target)) {
        dropdownOpen = false;
        servicesMenu.classList.add('hidden');
        servicesChevron.classList.remove('rotate-180', 'text-[#a7da32]');
      }
    });

    // ----------------------------------------------------
    // FLUID AURORA CANVAS LOGIC
    // ----------------------------------------------------
    const canvas = document.getElementById('aurora-canvas');
    const ctx = canvas.getContext('2d');
    
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    let mouse = { x: -1000, y: -1000 };

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener('mouseout', () => {
      mouse.x = -1000;
      mouse.y = -1000;
    });

    const orbs = [
      { baseColor: 'rgba(167, 218, 50, 0.4)', x: width * 0.25, y: height * 0.35, vx: 0.45, vy: 0.3, radius: Math.min(width, height) * 0.45, color: 'rgba(167, 218, 50, 0.4)' },
      { baseColor: 'rgba(124, 181, 24, 0.35)', x: width * 0.75, y: height * 0.65, vx: -0.35, vy: -0.25, radius: Math.min(width, height) * 0.5, color: 'rgba(124, 181, 24, 0.35)' },
      { baseColor: 'rgba(185, 231, 84, 0.28)', x: width * 0.5, y: height * 0.2, vx: 0.3, vy: -0.4, radius: Math.min(width, height) * 0.4, color: 'rgba(185, 231, 84, 0.28)' },
      { baseColor: 'rgba(43, 58, 30, 0.6)', x: width * 0.8, y: height * 0.25, vx: -0.4, vy: 0.35, radius: Math.min(width, height) * 0.42, color: 'rgba(43, 58, 30, 0.6)' },
      { baseColor: 'rgba(167, 218, 50, 0.25)', x: width * 0.3, y: height * 0.8, vx: 0.35, vy: 0.2, radius: Math.min(width, height) * 0.48, color: 'rgba(167, 218, 50, 0.25)' },
    ];

    const particles = Array.from({ length: 70 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 2.2 + 0.8,
      speedX: (Math.random() - 0.5) * 0.6,
      speedY: -Math.random() * 0.7 - 0.2,
      opacity: Math.random() * 0.6 + 0.2,
    }));

    let time = 0;

    function render() {
      time += 0.006;
      ctx.fillStyle = '#151517';
      ctx.fillRect(0, 0, width, height);

      // Mouse Interaction Glow
      if (mouse.x > -1000) {
        ctx.globalCompositeOperation = 'screen';
        const mouseRadial = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 250);
        mouseRadial.addColorStop(0, 'rgba(167, 218, 50, 0.15)');
        mouseRadial.addColorStop(1, 'rgba(21, 21, 23, 0)');
        ctx.fillStyle = mouseRadial;
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, 250, 0, Math.PI * 2);
        ctx.fill();
      }

      // Render Orbs
      orbs.forEach((orb, i) => {
        let targetX = orb.x + Math.sin(time + i) * 1.2 + orb.vx;
        let targetY = orb.y + Math.cos(time + i * 1.3) * 1.2 + orb.vy;

        // Mouse Repulsion
        if (mouse.x > -1000) {
          const dx = targetX - mouse.x;
          const dy = targetY - mouse.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          const interactionRadius = 400;

          if (distance < interactionRadius) {
            const force = (interactionRadius - distance) / interactionRadius;
            targetX += (dx / distance) * force * 15;
            targetY += (dy / distance) * force * 15;
          }
        }

        orb.x += (targetX - orb.x) * 0.1;
        orb.y += (targetY - orb.y) * 0.1;

        if (orb.x < -orb.radius * 0.2) orb.vx = Math.abs(orb.vx);
        if (orb.x > width + orb.radius * 0.2) orb.vx = -Math.abs(orb.vx);
        if (orb.y < -orb.radius * 0.2) orb.vy = Math.abs(orb.vy);
        if (orb.y > height + orb.radius * 0.2) orb.vy = -Math.abs(orb.vy);

        const radial = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, orb.radius);
        radial.addColorStop(0, orb.color);
        radial.addColorStop(0.5, orb.color.replace(/[\d\.]+\)$/, '0.12)'));
        radial.addColorStop(1, 'rgba(21, 21, 23, 0)');

        ctx.globalCompositeOperation = 'screen';
        ctx.fillStyle = radial;
        ctx.beginPath();
        ctx.arc(orb.x, orb.y, orb.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // Render Particles
      ctx.globalCompositeOperation = 'source-over';
      particles.forEach((p) => {
        p.x += p.speedX;
        p.y += p.speedY;

        // Particle Scatter
        if (mouse.x > -1000) {
          const pdx = p.x - mouse.x;
          const pdy = p.y - mouse.y;
          const pdistance = Math.sqrt(pdx * pdx + pdy * pdy);

          if (pdistance < 180) {
            const force = (180 - pdistance) / 180;
            p.x += (pdx / pdistance) * force * 4;
            p.y += (pdy / pdistance) * force * 4;
          }
        }

        if (p.y < -10) { p.y = height + 10; p.x = Math.random() * width; }
        if (p.x < -10) p.x = width + 10;
        if (p.x > width + 10) p.x = -10;

        ctx.fillStyle = `rgba(185, 231, 84, ${p.opacity})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(render);
    }
    
    render();
  </script>
</body>
</html>
