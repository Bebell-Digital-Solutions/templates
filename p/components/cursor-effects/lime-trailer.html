<!DOCTYPE html>
<html>
<head>


<link href='https://fonts.googleapis.com/css?family=Playfair Display SC' rel='stylesheet'>



<style>
body {
    background-color: black;
}


/* ===== NEON CURSOR TRAIL (lime #a7da32 palette, scoped to hero) ===== */

@media (pointer: coarse) {
  #neon-trail-canvas,
  #neon-cursor-dot { display: none !important; }
}
@media (prefers-reduced-motion: reduce) {
  #neon-trail-canvas,
  #neon-cursor-dot { display: none !important; }
}
    
    


</style>
</head>
<body>



  <!-- ================= HERO WRAP ================= -->


<div class="hero-card" style="position: relative; width: 100vw; height: 100vh;">
      <!-- ============ NEON CURSOR TRAIL (scoped to hero) ============ -->
    <canvas id="neon-trail-canvas"
            class="absolute inset-0 w-full h-full pointer-events-none z-[55] opacity-0 transition-opacity duration-500 ease-out"
            aria-hidden="true">

</canvas>
  </div>
  


   <!-- Interactive cursor trail --> 
  <script>
(function () {
  const isTouch = window.matchMedia('(pointer: coarse)').matches;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (isTouch || reducedMotion) return;

  const heroCard = document.querySelector('.hero-card');
  const canvas   = document.getElementById('neon-trail-canvas');
  if (!heroCard || !canvas) return;

  const ctx = canvas.getContext('2d');

  // ---- DPI-aware sizing ----
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;
  function resize() {
    const rect = heroCard.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // ================================================================
  //  STATE
  // ================================================================
  const TRAIL_LENGTH    = 26;    // ribbon segments
  const POINT_LIFETIME  = 420;   // ms a ribbon point lives
  const LINE_WIDTH      = 6;     // peak stroke width
  const SUBSTEPS        = 4;     // interpolation steps per mousemove
  const STAR_RATE       = 0.55;  // 0..1 — chance a substep spawns a star

  const points = [];             // { x, y, born }
  const stars  = [];             // { x, y, born, vx, vy, size, rot, vr }

  let lastX = -9999, lastY = -9999;
  let active = false;
  let raf = null;

  // ================================================================
  //  STAR SPAWNER
  // ================================================================
  function spawnStar(x, y) {
    stars.push({
      x, y,
      born: performance.now(),
      vx: (Math.random() - 0.5) * 0.9,      // gentle horizontal drift
      vy: 0.15 + Math.random() * 0.55,      // slight downward "rain" drift
      size: 1.8 + Math.random() * 2.6,      // 1.8 → 4.4 px
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.06      // spin
    });
  }

  // ================================================================
  //  INPUT
  // ================================================================
  heroCard.addEventListener('mouseenter', () => {
    active = true;
    canvas.style.opacity = '1';
    if (raf === null) raf = requestAnimationFrame(render);
  });

  heroCard.addEventListener('mouseleave', () => {
    active = false;
    canvas.style.opacity = '0';
    points.length = 0;
    stars.length  = 0;
    lastX = lastY = -9999;
    setTimeout(() => {
      if (!active) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (raf !== null) { cancelAnimationFrame(raf); raf = null; }
      }
    }, 400);
  });

  heroCard.addEventListener('mousemove', (e) => {
    const rect = heroCard.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const dx = x - lastX;
    const dy = y - lastY;
    const dist = Math.hypot(dx, dy);

    if (dist < 0.5) return;

    // ── Interpolate sub-points between last & current position ──
    // This is what makes the ribbon smooth on fast mouse moves.
    for (let i = 1; i <= SUBSTEPS; i++) {
      const t = i / SUBSTEPS;
      const px = lastX + dx * t;
      const py = lastY + dy * t;
      points.push({ x: px, y: py, born: performance.now() });

      // Possibly spawn a miniature star at this sub-point
      if (Math.random() < STAR_RATE * 0.35) spawnStar(px, py);
    }
    if (points.length > TRAIL_LENGTH) points.splice(0, points.length - TRAIL_LENGTH);

    lastX = x;
    lastY = y;
  });

  // ---- Pause when mobile menu opens ----
  const pauseObserver = new MutationObserver(() => {
    const menuOpen = !document.getElementById('mobile-menu')?.classList.contains('hidden');
    if (menuOpen) canvas.style.opacity = '0';
    else if (active) canvas.style.opacity = '1';
  });
  const mobileMenu = document.getElementById('mobile-menu');
  if (mobileMenu) pauseObserver.observe(mobileMenu, { attributes: true, attributeFilter: ['class'] });

  // ================================================================
  //  STAR DRAWING — 4-point sparkle (cross + diagonal cross)
  // ================================================================
  function drawStar(s, alpha, scale) {
    const r = s.size * scale;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);

    // Soft halo
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2.4);
    grad.addColorStop(0,    `rgba(233, 255, 176, ${alpha * 0.9})`);
    grad.addColorStop(0.5,  `rgba(167, 218, 50, ${alpha * 0.4})`);
    grad.addColorStop(1,    `rgba(167, 218, 50, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, r * 2.4, 0, Math.PI * 2);
    ctx.fill();

    // 4-point sparkle
    ctx.strokeStyle = `rgba(233, 255, 176, ${alpha})`;
    ctx.lineWidth = 1;
    ctx.lineCap = 'round';
    ctx.beginPath();
    // vertical
    ctx.moveTo(0, -r);   ctx.lineTo(0, r);
    // horizontal
    ctx.moveTo(-r, 0);   ctx.lineTo(r, 0);
    // diagonals (slightly shorter for a star shape)
    const d = r * 0.55;
    ctx.moveTo(-d, -d);  ctx.lineTo(d, d);
    ctx.moveTo(-d,  d);  ctx.lineTo(d, -d);
    ctx.stroke();

    ctx.restore();
  }

  // ================================================================
  //  RENDER
  // ================================================================
  function render() {
    const now = performance.now();
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    // ---------- Expire old points & stars ----------
    while (points.length && now - points[0].born > POINT_LIFETIME) points.shift();
    for (let i = stars.length - 1; i >= 0; i--) {
      if (now - stars[i].born > 900) stars.splice(i, 1);
    }

    // ---------- Ribbon (smooth curves) ----------
    if (points.length >= 2) {
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Outer glow pass
      for (let i = 1; i < points.length; i++) {
        const a = points[i - 1], b = points[i];
        const t = i / points.length;
        const age = 1 - Math.min((now - b.born) / POINT_LIFETIME, 1);
        const strength = t * age;

        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        // midpoint for smooth curve
        const mx = (a.x + b.x) / 2;
        const my = (a.y + b.y) / 2;
        ctx.quadraticCurveTo(a.x, a.y, mx, my);
        ctx.strokeStyle = `rgba(167, 218, 50, ${strength * 0.32})`;
        ctx.lineWidth = LINE_WIDTH * 2.6 * strength;
        ctx.stroke();
      }

      // Inner bright core pass
      for (let i = 1; i < points.length; i++) {
        const a = points[i - 1], b = points[i];
        const t = i / points.length;
        const age = 1 - Math.min((now - b.born) / POINT_LIFETIME, 1);
        const strength = t * age;

        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        const mx = (a.x + b.x) / 2;
        const my = (a.y + b.y) / 2;
        ctx.quadraticCurveTo(a.x, a.y, mx, my);
        ctx.strokeStyle = `rgba(233, 255, 176, ${strength * 0.85})`;
        ctx.lineWidth = LINE_WIDTH * strength;
        ctx.stroke();
      }
    }

    // ---------- Stars (pluie d'étoiles) ----------
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const age = (now - s.born) / 900;          // 0 → 1 over 900ms
      if (age >= 1) continue;

      // Move with drift
      s.x += s.vx;
      s.y += s.vy;
      s.rot += s.vr;

      // Twinkle: sine wave on top of fade
      const fade     = 1 - age;                  // linear fade
      const twinkle  = 0.6 + 0.4 * Math.sin(now * 0.015 + i);
      const alpha    = fade * twinkle;
      const scale    = 0.6 + (1 - fade) * 0.9;   // grows slightly as it fades

      drawStar(s, alpha, scale);
    }

    raf = requestAnimationFrame(render);
  }

  // ---- Perf: stop when tab hidden ----
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (raf !== null) { cancelAnimationFrame(raf); raf = null; }
    } else if (raf === null) {
      raf = requestAnimationFrame(render);
    }
  });

  raf = requestAnimationFrame(render);
})();
</script>

</body>
</html>
