<!DOCTYPE html>
<html>
<head>
<style>
/* global color */
:root {
  --main-white: #000;
  --title-dark--color: #222222;
  --desc-dark-color: #353535;
  --green-color: #45C569;
}
/* color */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  height: 100%;
}

body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  background: var(--main-white);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

header {
  margin: 0;
}
  

div, ul, li, a, p, span, button, section, h1, h2, h3, h4, h5 {
  padding: 0;
  margin: 0;
}

.container {
  width: 1200px;
  margin: 0 auto;
}

/* remove fixed bottom margin so flex centering works cleanly */
section {
  margin-bottom: 0;
}

/* Photo Grid */
.photo-grids-wrapp {
  margin-top: 60px;
  display: grid;
  grid-template-areas: "a b d" "a c d";
  height: 407px;
  width: 100%;
  gap: 40px;
}

.photo-grids-wrapp div {
  overflow: hidden;
  border-radius: 20px;
  transition: 0.4s;
  box-shadow: 6px 11px 16px rgba(0, 0, 0, 0.15);
  cursor: pointer;
}

.photo-grids-wrapp div img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: 0.6s;
}

.photo-grids-wrapp div:hover {
  box-shadow: 6px 11px 16px rgba(0, 0, 0, 0.3);
}

.photo-grids-wrapp div:hover img {
  transform: scale(110%);
}

.photo-grids-wrapp__item1 { grid-area: a; }
.photo-grids-wrapp__item2 { grid-area: b; }
.photo-grids-wrapp__item3 { grid-area: c; }
.photo-grids-wrapp__item4 { grid-area: d; }

@media (max-width: 1200px) {
  .container {
    width: 100%;
    padding: 0 20px;
  }

  .photo-grids-wrapp {
    gap: 10px;
    margin-top: 20px;
    height: 320px;
  }
}

@media (max-width: 700px) {
  .photo-grids-wrapp {
    grid-template-areas: "a a a a" "b b c c" "d d d d";
    height: auto;
    grid-template-rows: 200px 150px 200px;
  }
}

@media (max-width: 400px) {
  .container {
    padding: 0 15px;
  }
  .photo-grids-wrapp {
    grid-template-rows: 150px 120px 150px;
    gap: 8px;
  }
}
</style>
</head>
<body>

  <section class="Interior-section white-section" id="Interior">
    <div class="container">
      <div class="photo-grids-wrapp cliks-elem-wrapper">
        <div class="photo-grids-wrapp__item1 cliks-elem">
          <img src="https://ik.imagekit.io/bebell/Banners%20&%20Backgrounds/assets/imageye___-_imgi_132_16x9-hedra-marketing-image-5.png?updatedAt=1789016451191" alt="">
        </div>
        <div class="photo-grids-wrapp__item2 cliks-elem">
          <img src="https://ik.imagekit.io/bebell/Banners%20&%20Backgrounds/assets/imageye___-_imgi_1308_image-05.png?updatedAt=1789016450602" alt="">
        </div>
        <div class="photo-grids-wrapp__item3 cliks-elem">
          <img src="https://ik.imagekit.io/bebell/Banners%20&%20Backgrounds/assets/imageye___-_imgi_1133_83bac57a-7ea4-42b4-863c-aeac77432a5a.png?updatedAt=1789016450441" alt="">
        </div>
        <div class="photo-grids-wrapp__item4 cliks-elem">
          <img src="https://ik.imagekit.io/bebell/Banners%20&%20Backgrounds/assets/imageye___-_imgi_1375_imagepodcast2.png?updatedAt=1789016450337" alt="">
        </div>
      </div>
    </div>
  </section>

</body>
</html>
