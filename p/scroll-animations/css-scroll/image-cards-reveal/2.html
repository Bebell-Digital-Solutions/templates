<!DOCTYPE html>
<html>
<head>


  <link href='https://fonts.googleapis.com/css?family=Playfair Display SC' rel='stylesheet'>
  
  
  <link rel="stylesheet" href="https://unpkg.com/open-props"/>
  
  
  <link rel="stylesheet" href="https://unpkg.com/open-props/normalize.min.css"/>
  
  

<style>
@property --card-rotation-progress {
  syntax: "<number>";
  inherits: true;
  initial-value: 0;
}

@property --radial-progress {
  syntax: "<number>";
  inherits: true;
  initial-value: 0;
}

body {
  min-height: 200vh;
  padding-top: 50vh;
  background-color: var(--gray-0);
}

:where(h3) {
  margin-block-end: var(--size-3);
}

.container {
  max-width: 80rem;
  padding-inline: var(--size-5);
  margin-block: 2rem;
  margin-inline: auto;
}

.grid-center {
  display: grid;
  place-items: center;
}

.section {
  container-type: inline-size;
  position: relative;
}

/* Updated to style image elements directly */
img.demo-image {
  display: block;
  width: 100%;
  aspect-ratio: 1/1.5;
  object-fit: cover;
  background: var(--blue-1);
  border-radius: var(--radius-3);
  border: 4px solid var(--gray-0);
  box-shadow: var(--shadow-3);

  @container (width > 40rem) {
    width: 100%;
    height: 100%;
    aspect-ratio: initial;
  }
}

.panel {
  box-shadow: var(--shadow-3);
  background: var(--gray-1);
  border-radius: var(--radius-3);
  color: var(--gray-8);
  margin: 0 auto;
  max-width: 980px;
}

.panel__content {
  padding: var(--size-fluid-4);
}

.split-h {
  display: grid;
  gap: 1rem;

  @container (width > 48.7rem) {
    grid-template-columns: repeat(2, 1fr);
  }
}

.cards {
  container-type: inline-size;
  position: relative;
  height: 50vh;
  width: min(100%, 350px);
  clip-path: polygon(-50% -50%, 400% -50%, 150% 100%, -80% 100%);
  margin-inline: auto;
  margin-block-start: -20%;
}

.card {
  --count: 4;

  --angle-min: -45;
  --angle-max: 45;
  --angle-diff: calc(var(--angle-max) - var(--angle-min));
  --angle-step: calc(var(--angle-diff) / (var(--count) + 1));
  --angle: calc(var(--angle-min) + var(--angle-step) * var(--index));
  --angle-deg: calc((var(--angle) * var(--card-rotation-progress)) * 1deg);

  width: 100%;
  position: absolute;
  transform-origin: bottom center;
  rotate: var(--angle-deg);
  translate: 0 50%;

  animation: cardUp 1ms ease-out both, cardRotate 1ms ease-out forwards;
  animation-timeline: view(block);
  animation-range: entry 100% contain 50%;
}

.card:nth-child(1) { --index: 1; }
.card:nth-child(2) { --index: 2; }
.card:nth-child(3) { --index: 3; }
.card:nth-child(4) { --index: 4; }

@keyframes cardUp {
  from { translate: 0 80%; }
  to { translate: 0 20%; }
}

@keyframes cardRotate {
  from { --card-rotation-progress: 0; }
  to { --card-rotation-progress: 1; }
}

</style>
</head>
<body>
    <section class="section panel">
      <div class="split-h">
        <div class="grid-center">
          <div class="panel__content">
            <h3>Enrich your product page</h3>
            <p>
              Look at those cards. They animate in from the bottom and with
              some magic they also rotate. Isn't that amazing? With some
              fancy clip-path it should not overflow the bottom.
            </p>
          </div>
        </div>

        <div>
          <div class="cards">
            <!-- Replaced empty divs with real image tags -->
            <div class="card"><img class="demo-image" src="https://images.unsplash.com/photo-1512314889357-e157c22f938d?q=80&w=400&auto=format&fit=crop" alt="Demo Notebook"></div>
            <div class="card"><img class="demo-image" src="https://images.unsplash.com/photo-1534670007418-fbb7f6cf32c3?q=80&w=400&auto=format&fit=crop" alt="Demo Typography"></div>
            <div class="card"><img class="demo-image" src="https://images.unsplash.com/photo-1505909182942-e2f09aee3e89?q=80&w=400&auto=format&fit=crop" alt="Demo Geometry"></div>
            <div class="card"><img class="demo-image" src="https://images.unsplash.com/photo-1512295767273-ac109ac3acfa?q=80&w=400&auto=format&fit=crop" alt="Demo Workspace"></div>
          </div>
        </div>
      </div>
    </section>
</body>
</html>
