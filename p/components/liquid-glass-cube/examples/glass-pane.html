<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass pane — Liquid Glass Cube</title>
  <style>
    * { box-sizing: border-box; }
    *:focus, *:focus-visible { outline: none; }
    html, body { margin: 0; height: 100%; }
    body { background: #d6edf0; color: #0b3b46; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .top { position: fixed; top: 22px; left: 0; right: 0; text-align: center; font-size: 13px; font-weight: 600; letter-spacing: -.01em; pointer-events: none; opacity: .75; }
    .bar { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; padding: 8px; border-radius: 999px; background: rgba(255,255,255,.6); border: 1px solid rgba(255,255,255,.85); box-shadow: 0 18px 50px rgba(20,60,80,.18); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); max-width: calc(100vw - 24px); }
    input { width: 190px; height: 40px; border-radius: 999px; border: 0; background: rgba(11,59,70,.07); padding: 0 16px; font: inherit; font-size: 14px; font-weight: 500; color: #0b3b46; }
    input::placeholder { color: rgba(11,59,70,.5); }
    button { font: inherit; border: 0; cursor: pointer; height: 40px; padding: 0 16px; border-radius: 999px; font-size: 13px; font-weight: 600; background: rgba(11,59,70,.07); color: #0b3b46; }
    button[aria-pressed="true"] { background: #0b3b46; color: #fff; }
    a.back { position: fixed; top: 18px; right: 20px; color: inherit; text-decoration: none; font-size: 12.5px; font-weight: 600; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.6); }
  </style>
</head>
<body>
  <canvas id="pane" aria-label="Interactive liquid glass pane"></canvas>
  <div class="top">A glass pane magnifies whatever is painted behind it</div>
  <a class="back" href="../index.html">Playground</a>
  <div class="bar" id="bar">
    <input id="word" type="text" maxlength="14" placeholder="Type a word" autocomplete="off" spellcheck="false">
  </div>
  <script src="../assets/js/liquid-glass-cube.js"></script>
  <script>
    var LG = LiquidGlassCube;
    var glass = LG.create('#pane', { shape: 'pane', scene: 'glacier', text: 'Hello', hint: '' });
    var bar = document.getElementById('bar'), btns = {};
    ['glacier', 'sunset', 'ink', 'studio'].forEach(function (k, i) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = LG.scenes[k].label;
      b.setAttribute('aria-pressed', i === 0);
      b.addEventListener('click', function () { glass.setScene(k); Object.keys(btns).forEach(function (n) { btns[n].setAttribute('aria-pressed', n === k); }); });
      bar.appendChild(b); btns[k] = b;
    });
    document.getElementById('word').addEventListener('input', function (e) { glass.set({ text: e.target.value === '' ? 'Hello' : e.target.value }); });
  </script>
</body>
</html>
