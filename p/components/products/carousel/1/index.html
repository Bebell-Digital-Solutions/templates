<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

	
<!-- Poppins (actually used) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<!-- Swiper CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

<style>
* { box-sizing: border-box; }

body {
	min-height: 100vh;
	margin: 0;
	padding: 2rem;
	font-family: "Poppins", sans-serif;
	background-image: linear-gradient(
		to right bottom,
		#ffffff,
		#f9f8f9,
		#f3f0f2,
		#eee8ea,
		#e9e1e1
	);
}

nav {
	width: 100%;
	max-width: 400px;
	margin: 0 auto 20px;
	display: flex;
	justify-content: space-between;
	align-items: center;
	border-bottom: 1px solid #4e4f4e;
	height: 2rem;
}

.logo {
	display: flex;
	justify-content: center;
	align-items: center;
	font-size: 14px;
	gap: 2px;
	letter-spacing: -2px;
}

.logo h1 {
	margin: 0;
	font-size: 14px;   /* stop the default 28px h1 from stretching the nav */
	letter-spacing: -2px;
}

.icons {
	display: flex;
	justify-content: center;
	align-items: center;
	gap: 10px;
}

/* Let Swiper own the layout — only set size + theme vars here */
.swiper {
	width: 100%;
	max-width: 400px;
	margin: 0 auto;
	border-radius: 16px;
	--swiper-navigation-size: 20px;
	--swiper-navigation-color: #4e4f4e;
	--swiper-pagination-color: #4e4f4e;
	--swiper-pagination-bullet-inactive-color: #b9b6b6;
	--swiper-pagination-bullet-inactive-opacity: 1;
}

.swiper-slide {
	border-radius: 16px;
	overflow: hidden;
	border: 1px solid #f7f7f7;
	background-color: #fff;
    height: 680px;
    max-height: 680px;
	/* keeps 3D cube faces from bleeding */
	-webkit-backface-visibility: hidden;
	backface-visibility: hidden;
}

/* Fixed height so every cube face is the same size */
.card-img img {
	display: block;
	width: 100%;
	height: auto;
	object-fit: cover;
}

.details {
	display: flex;
	gap: 20px;
	align-items: center;
	padding: 8px 10px;
	border-radius: 12px 12px 0 0;
    padding-top: 1rem;
	background-color: white;
}

.details h3 {
	font-size: 12px;
	font-weight: bold;
    padding-left: 1rem;
	margin: 0;
}

.details p {
	background-color: #f97907;
	padding: 0.3rem 0.8rem;
	border-radius: 12px;
	font-size: 12px;
	color: white;
	margin: 0;
}

.details button {
	border: 1px solid black;
	background-color: white;
	border-radius: 50%;
	width: 30px;
	height: 30px;
	display: flex;
	align-items: center;
	cursor: pointer;
}

.details button:hover { opacity: 0.85; }

/* Pagination sits over the image – give it room */
.swiper-pagination { bottom: 8px !important; }
</style>
</head>
<body>

<header>
	<nav>
		<div class="logo">
			<svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="#000000">
				<path d="M144-264v-72h240v72H144Zm0-180v-72h432v72H144Zm0-180v-72h672v72H144Z" />
			</svg>
			<h1>Shop</h1>
		</div>
		<div class="icons">
			<svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="#000000" aria-label="search">
				<path d="M765-144 526-383q-30 22-65.79 34.5-35.79 12.5-76.18 12.5Q284-336 214-406t-70-170q0-100 70-170t170-70q100 0 170 70t70 170.03q0 40.39-12.5 76.18Q599-464 577-434l239 239-51 51ZM384-408q70 0 119-49t49-119q0-70-49-119t-119-49q-70 0-119 49t-49 119q0 70 49 119t119 49Z" />
			</svg>
			<svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="#000000" aria-label="avatar">
				<path d="M480-480q-60 0-102-42t-42-102q0-60 42-102t102-42q60 0 102 42t42 102q0 60-42 102t-102 42ZM192-192v-96q0-23 12.5-43.5T239-366q55-32 116.29-49 61.29-17 124.5-17t124.71 17Q666-398 721-366q22 13 34.5 34t12.5 44v96H192Zm72-72h432v-24q0-5.18-3.03-9.41-3.02-4.24-7.97-6.59-46-28-98-42t-107-14q-55 0-107 14t-98 42q-5 4-8 7.72-3 3.73-3 8.28v24Zm216.21-288Q510-552 531-573.21t21-51Q552-654 530.79-675t-51-21Q450-696 429-674.79t-21 51Q408-594 429.21-573t51 21Zm-.21-72Zm0 360Z" />
			</svg>
		</div>
	</nav>
</header>

<div class="swiper">
	<div class="swiper-wrapper">
		<div class="swiper-slide">
			<div class="details">
				<h3>Black T-Shirt</h3>
				<p>$120.00 USD</p>
			</div>
			<div class="card-img">
				<img src="https://images.unsplash.com/photo-1618354691229-88d47f285158?w=500&auto=format&fit=crop&q=60" alt="Black T-Shirt Photo by Ryan Hoffmann from Unsplash" loading="lazy" />
			</div>
		</div>
		<div class="swiper-slide">
			<div class="details">
				<h3>Black T-Shirt</h3>
				<p>$20.00 USD</p>
			</div>
			<div class="card-img">
				<img src="https://images.unsplash.com/photo-1618354691438-25bc04584c23?w=500&auto=format&fit=crop&q=60" alt="Black T-Shirt Photo by Ryan Hoffmann from Unsplash" loading="lazy" />
			</div>
		</div>
		<div class="swiper-slide">
			<div class="details">
				<h3>Black T-Shirt</h3>
				<p>$20.00 USD</p>
			</div>
			<div class="card-img">
				<img src="https://images.unsplash.com/photo-1618354691373-d851c5c3a990?w=500&auto=format&fit=crop&q=60" alt="Black T-Shirt Photo by Ryan Hoffmann from Unsplash" loading="lazy" />
			</div>
		</div>
	</div>

	<div class="swiper-pagination"></div>
	<div class="swiper-button-prev" id="prev-button"></div>
	<div class="swiper-button-next" id="next-button"></div>
</div>

<!-- Swiper JS (must come before your init script) -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
const swiper = new Swiper(".swiper", {
	direction: "horizontal",
	loop: true,
	effect: "cube",
	cubeEffect: {
		shadow: false,
		slideShadows: false
	},
	speed: 700,
	autoplay: {
		delay: 4000,
		disableOnInteraction: false
	},
	pagination: {
		el: ".swiper-pagination",
		clickable: true
	},
	navigation: {
		nextEl: ".swiper-button-next",
		prevEl: ".swiper-button-prev"
	}
});
</script>
</body>
</html>
