    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcfbfe;
            /* Hexagon / Honeycomb faint background */
            background-image: url("data:image/svg+xml,%3Csvg width='42' height='44' viewBox='0 0 42 44' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M21 0L0 11v22l21 11 21-11V11L21 0zm0 41.5L2.3 32V12L21 2.5 39.7 12v20L21 41.5z' fill='%236D28D9' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
            overflow-x: hidden;
        }

        /* Soft purple radial glow behind the carousel */
        .radial-glow {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 1200px;
            height: 800px;
            background: radial-gradient(circle at 50% 40%, rgba(124, 58, 237, 0.12) 0%, rgba(255,255,255,0) 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* Carousel Base Container */
        .carousel-container {
            position: relative;
            width: 100%;
            height: 480px;
            margin-top: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
            z-index: 10;
        }

        /* Carousel Card Element */
        .carousel-item {
            position: absolute;
            width: 90%;
            max-width: 640px;
            aspect-ratio: 16 / 9.5;
            left: 50%;
            top: 50%;
            border-radius: 2rem;
            gap: 8rem;
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform, opacity, z-index;
            /* Using calc variables to achieve fluid, dynamic overlapping */
            transform-origin: center center;
        }

        /* Coverflow States */
        .item-active {
            transform: translate(-50%, -50%) scale(1) rotate(0deg);
            opacity: 1;
            z-index: 30;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
        }

        .item-prev {
            /* Shift left, tilt counter-clockwise, scale down. Increased gap. */
            transform: translate(calc(-50% - 90%), -50%) scale(0.85) rotate(-8deg);
            opacity: 1;
            padding-top: 3rem;
            padding-right: 6rem;
            z-index: 20;
            box-shadow: 0 10px 30px -6rem rgba(0, 0, 0, 0.2);
            cursor: pointer;
        }

        .item-next {
            /* Shift right, tilt clockwise, scale down. Increased gap. */
            transform: translate(calc(-50% + 90%), -50%) scale(0.85) rotate(8deg);
            opacity: 1;
            padding-top: 3rem;
            padding-left: 6rem;
            z-index: 20;
            box-shadow: 0 10px 30px -6rem rgba(0, 0, 0, 0.2);
            cursor: pointer;
        }

        .item-prev-hidden {
            transform: translate(calc(-50% - 160%), -50%) scale(0.6) rotate(-20deg);
            opacity: 0;
            z-index: 10;
            pointer-events: none;
        }

        .item-next-hidden {
            transform: translate(calc(-50% + 160%), -50%) scale(0.6) rotate(20deg);
            opacity: 0;
            z-index: 10;
            pointer-events: none;
        }

        /* Arrow display logic based on state */
        .carousel-item .nav-arrow-left,
        .carousel-item .nav-arrow-right {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .item-prev .nav-arrow-left {
            opacity: 1;
            pointer-events: auto;
        }

        .item-next .nav-arrow-right {
            opacity: 1;
            pointer-events: auto;
        }

        /* Torn Paper CSS Hack for Right Card */
        .torn-paper {
            clip-path: polygon(
                1% 2%, 15% 1%, 32% 3%, 45% 0%, 60% 2%, 85% 1%, 98% 3%, 
                99% 25%, 97% 45%, 99% 70%, 98% 95%, 
                85% 99%, 70% 97%, 45% 98%, 25% 97%, 3% 98%, 
                1% 80%, 2% 55%, 0% 30%
            );
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .carousel-container { 
            height: 350px; 
            }
            .item-prev { 
            transform: translate(calc(-50% - 60%), -50%) scale(0.75) rotate(-10deg); 
            }
            
            .item-next { 
            transform: translate(calc(-50% + 60%), -50%) scale(0.75) rotate(10deg); 
            }
        }
        
        
    </style>

    <!-- JavaScript logic for Infinite Carousel -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const items = document.querySelectorAll('.carousel-item');
            const carouselContainer = document.getElementById('carousel');
            let currentIndex = 1; // Start with the second card (Man on Laptop) as center
            let intervalId;
            let isHovering = false;

            function updateCarousel() {
                items.forEach((item, index) => {
                    // Clear previous states
                    item.classList.remove('item-active', 'item-prev', 'item-next', 'item-prev-hidden', 'item-next-hidden');
                    
                    // Calculate relative distance considering the wrapping for infinite loop
                    let diff = index - currentIndex;
                    const total = items.length;
                    
                    // Wrap the difference so it always represents the shortest path
                    if (diff < -Math.floor(total / 2)) diff += total;
                    if (diff > Math.floor(total / 2)) diff -= total;

                    // Apply layout classes based on exact position
                    if (diff === 0) {
                        item.classList.add('item-active');
                    } else if (diff === -1) {
                        item.classList.add('item-prev');
                    } else if (diff === 1) {
                        item.classList.add('item-next');
                    } else if (diff === -2 || diff < -1) {
                        item.classList.add('item-prev-hidden');
                    } else if (diff === 2 || diff > 1) {
                        item.classList.add('item-next-hidden');
                    }
                });
            }

            // Expose globally for the arrow buttons
            window.nextSlide = function() {
                currentIndex = (currentIndex + 1) % items.length;
                updateCarousel();
            }

            window.prevSlide = function() {
                currentIndex = (currentIndex - 1 + items.length) % items.length;
                updateCarousel();
            }

            // Auto Play Mechanics
            function startAutoPlay() {
                if(!intervalId) {
                    intervalId = setInterval(() => {
                        if (!isHovering) window.nextSlide();
                    }, 3000);
                }
            }

            function stopAutoPlay() {
                clearInterval(intervalId);
                intervalId = null;
            }

            // Event listeners to Pause on hover
            carouselContainer.addEventListener('mouseenter', () => {
                isHovering = true;
                stopAutoPlay();
            });
            
            carouselContainer.addEventListener('mouseleave', () => {
                isHovering = false;
                startAutoPlay();
            });

            // Initialize
            updateCarousel();
            startAutoPlay();
        });
    </script>
