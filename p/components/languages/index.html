<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supports 30+ Languages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section class="languages-section" aria-label="Supported languages">
    <div class="languages-header">
      <h2>Supports 30+ languages.</h2>
      <p>
        Serve clients anywhere in the world without barriers.<br />
        Localize your white-label dashboard to offer in your clients' native language, under your own brand.
      </p>
    </div>

    <!-- Marquee rows are dynamically populated by script.js -->
    <div class="marquee-wrapper" id="marquee-container"></div>
  </section>

  <script src="script.js"></script>
</body>
