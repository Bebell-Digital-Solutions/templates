<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modulars — Creative Design Agency</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css?family=Playfair+Display+SC" rel="stylesheet">

<style>
/* ============================================================
   BASE
   ============================================================ */
*,
*::before,
*::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  overflow-x: hidden;
  background: #fff;
  color: #153d3d;
  font-family: "Poppins", sans-serif;
}

img { display: block; max-width: 100%; }


/* ============================================================
   NAV
   ============================================================ */
nav {
  position: relative;          /* anchor for the mobile dropdown */
  z-index: 50;
  max-width: 1200px;
  margin: 0 auto;
  padding: 18px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-family: "Poppins", sans-serif;
}

#logo {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: .06em;
  color: #153d3d;
  white-space: nowrap;
}

/* wrapper that holds links + CTA */
.nav-menu {
  display: flex;
  align-items: center;
  gap: 36px;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 36px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.nav-links a {
  color: #153d3d;
  font-size: 15px;
  font-weight: 500;
  text-decoration: none;
  transition: color .2s ease;
}

.nav-links a:hover { color: #286318; }

.nav-btn {
  padding: 14px 30px;
  border: 1px solid transparent;
  border-radius: 50px;
  background-color: #153d3d;
  color: #fff;
  font-family: "Poppins", sans-serif;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: background-color .25s ease, transform .25s ease;
}

.nav-btn:hover {
  background-color: #286318;
  transform: translateY(-2px);
}

/* ---- burger (hidden on desktop) ---- */
.burger {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: 12px;
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.burger span {
  display: block;
  width: 22px;
  height: 2px;
  border-radius: 2px;
  background: #153d3d;
  transition: transform .3s ease, opacity .2s ease;
}

.burger.is-open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.burger.is-open span:nth-child(2) { opacity: 0; }
.burger.is-open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }


/* ============================================================
   HERO
   ============================================================ */
.main {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px;
  height: 850px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 4fr 0.8fr;
  column-gap: 12px;
  row-gap: 24px;
}

.txt {
  grid-column: 1 / 2;
  grid-row: 1 / 2;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: left;
  padding: 20px;
}

.txt h2 {
  margin: 0;
  font-size: 65px;
  line-height: 1.05;
  color: #286318;
}

.txt p {
  margin: 16px 0 0;
  font-size: 25px;
  line-height: 1.5;
  color: #153d3d;
}

.buttons {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 24px;
  margin-top: 32px;
}

.button {
  border: 1px solid transparent;
  border-radius: 50px;
  font-family: "Poppins", sans-serif;
  font-weight: 700;
  font-size: 16px;
  padding: 15px 30px;
  cursor: pointer;
  transition: background-color .25s ease, color .25s ease,
              transform .25s ease, box-shadow .25s ease;
}

#btn1 {
  background-color: #153d3d;
  color: #fff;
}

#btn1:hover {
  background-color: #286318;
  transform: translateY(-2px);
  box-shadow: 0 10px 20px -8px rgba(40, 99, 24, .5);
}

#btn2 {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: transparent;
  color: #153d3d;
}

#btn2:hover {
  background-color: #e2eddf;
  transform: translateY(-2px);
}

.circle {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background-color: #153d3d;
  transition: background-color .25s ease;
}

#btn2:hover .circle { background-color: #286318; }

#btn2 img {
  width: 22px;
  height: 22px;
  object-fit: contain;
  filter: brightness(0) invert(1);   /* make the play icon white */
}

/* ---- picture collage ---- */
.pictures {
  grid-column: 2 / 3;
  grid-row: 1 / 2;
  position: relative;
  display: flex;
  flex-direction: row;
  justify-content: space-between;
  gap: 10px;
  padding: 30px;
  background: radial-gradient(#153d3dce, #153d3d4f, #fff, #fff);
}

.img {
  width: 30%;
  height: 80%;
  border-radius: 999px;
  background-repeat: no-repeat;
  background-size: cover;
}

#img1 {
  background-image: url("https://assets-news.housing.com/news/wp-content/uploads/2022/08/18184418/Green-colour-wall-paint-design-ideas-to-give-your-home-a-fresh-look-03.jpg");
  background-position: center right;
  align-self: flex-start;
}

#img2 {
  background-image: url("https://cdn.shopify.com/s/files/1/0305/9521/9595/files/Screenshot_2022-04-01_at_08.45.14_480x480.png?v=1648799148");
  background-position: center center;
  align-self: flex-end;
}

#img3 {
  background-image: url("https://i.pinimg.com/736x/05/91/78/0591788328fe38fe3f691b0028630595.jpg");
  background-position: center left;
  align-self: flex-start;
}

/* ---- brand strip ---- */
.brands {
  grid-column: 1 / 3;
  grid-row: 2 / 3;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-evenly;
  gap: 30px;
  padding: 0 10px;
  border-radius: 80px;
  background-color: #e2eddf;
}

.brands img {
  width: 100px;
  max-width: 150px;
}


/* ============================================================
   LOAD ANIMATION
   ============================================================ */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

nav,
.txt h2,
.txt p,
.buttons,
.pictures,
.brands {
  animation: fadeInUp .8s ease-out both;
}

.txt h2   { animation-delay: .10s; }
.txt p    { animation-delay: .25s; }
.buttons  { animation-delay: .40s; }
.pictures { animation-delay: .20s; }
.brands   { animation-delay: .55s; }


/* ============================================================
   TABLET / MOBILE  (≤ 960px)  →  burger menu + stacked hero
   ============================================================ */
@media (max-width: 960px) {

  nav { padding: 16px 20px; }

  /* show burger, hide the inline menu until opened */
  .burger { display: flex; }

  .nav-menu {
    position: absolute;
    top: calc(100% + 6px);
    left: 16px;
    right: 16px;

    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    padding: 16px;

    background: #fff;
    border: 1px solid #e2eddf;
    border-radius: 22px;
    box-shadow: 0 24px 48px -16px rgba(21, 61, 61, .28);

    opacity: 0;
    visibility: hidden;
    transform: translateY(-10px);
    transition: opacity .25s ease, transform .25s ease, visibility .25s ease;
  }

  .nav-menu.is-open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .nav-links {
    flex-direction: column;
    align-items: stretch;
    gap: 2px;
  }

  .nav-links a {
    display: block;
    padding: 13px 16px;
    border-radius: 14px;
    font-size: 16px;
  }

  .nav-links a:hover { background: #e2eddf; }

  .nav-btn {
    width: 100%;
    padding: 15px 24px;
  }

  /* ---- hero ---- */
  .main {
    height: auto;
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto;
    row-gap: 28px;
    padding: 36px 20px 48px;   /* ← breathing room below the nav */
  }

  .txt {
    grid-column: 1 / -1;
    grid-row: 1 / 2;
    padding: 0;
  }

  .txt h2 { font-size: 44px; }
  .txt p  { font-size: 18px; line-height: 1.7; margin-top: 18px; }

  .pictures {
    grid-column: 1 / -1;
    grid-row: 2 / 3;
    height: 380px;
    padding: 18px;
  }

  .brands {
    grid-column: 1 / -1;
    grid-row: 3 / 4;
    flex-wrap: wrap;
    gap: 24px;
    padding: 24px 16px;
    border-radius: 40px;
  }
}


/* ============================================================
   SMALL PHONES  (≤ 640px)
   ============================================================ */
@media (max-width: 640px) {

  .main {
    padding: 28px 16px 40px;
    row-gap: 24px;
  }

  .txt h2 { font-size: 34px; }
  .txt p  { font-size: 16px; }

  .buttons {
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
    margin-top: 26px;
  }

  .button {
    width: 100%;
    justify-content: center;
  }

  /* keep the 3-pill collage in one row, just shorter */
  .pictures {
    height: 250px;
    padding: 12px;
    gap: 8px;
  }

  .img {
    width: 30%;
    height: 100%;
  }

  .brands {
    gap: 16px;
    padding: 20px 12px;
  }

  .brands img { width: 74px; }
}


/* ============================================================
   REDUCED MOTION
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}
</style>
</head>

<body>

<nav>
  <p id="logo">MODULARS</p>

  <div class="nav-menu" id="navMenu">
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Blog</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
    <button class="nav-btn" type="button">Sign Up</button>
  </div>

  <button class="burger" id="burger" type="button"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="navMenu">
    <span></span>
    <span></span>
    <span></span>
  </button>
</nav>


<div class="main">
  <div class="txt">
    <h2>We're a creative design agency.</h2>
    <p>A brilliant, modular agency template for startups — build yours today. Lorem ipsum dolor sit amet consectetur adipisicing elit. Quo quia esse nihil.</p>

    <div class="buttons">
      <button class="button" id="btn1" type="button">Get in touch</button>

      <button class="button" id="btn2" type="button">
        <span class="circle">
          <img src="https://static.vecteezy.com/system/resources/previews/017/196/544/non_2x/play-button-icon-transparent-background-free-png.png" alt="">
        </span>
        Watch Video
      </button>
    </div>
  </div>

  <div class="pictures">
    <div class="img" id="img1"></div>
    <div class="img" id="img2"></div>
    <div class="img" id="img3"></div>
  </div>

  <div class="brands">
    <img src="https://www.freepnglogos.com/uploads/google-logo-png/google-logo-png-google-sva-scholarship-20.png" alt="Google">
    <img src="https://1000logos.net/wp-content/uploads/2021/06/Slack-logo.png" alt="Slack">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/Agworld_Logo.svg/3840px-Agworld_Logo.svg.png" alt="Agworld">
    <img src="https://download.logo.wine/logo/Rio_Tinto_(corporation)/Rio_Tinto_(corporation)-Logo.wine.png" alt="Rio Tinto">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Heroku_logo.svg/960px-Heroku_logo.svg.png" alt="Heroku">
  </div>
</div>


<script>
(function () {
  const burger  = document.getElementById('burger');
  const navMenu = document.getElementById('navMenu');

  function openMenu() {
    navMenu.classList.add('is-open');
    burger.classList.add('is-open');
    burger.setAttribute('aria-expanded', 'true');
    burger.setAttribute('aria-label', 'Close menu');
  }

  function closeMenu() {
    navMenu.classList.remove('is-open');
    burger.classList.remove('is-open');
    burger.setAttribute('aria-expanded', 'false');
    burger.setAttribute('aria-label', 'Open menu');
  }

  function toggleMenu() {
    navMenu.classList.contains('is-open') ? closeMenu() : openMenu();
  }

  burger.addEventListener('click', toggleMenu);

  /* close after tapping a link or the CTA */
  navMenu.querySelectorAll('a, button').forEach(function (el) {
    el.addEventListener('click', closeMenu);
  });

  /* close when tapping outside */
  document.addEventListener('click', function (e) {
    if (!navMenu.contains(e.target) && !burger.contains(e.target)) closeMenu();
  });

  /* close on Escape */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeMenu();
  });

  /* reset state when resizing back up to desktop */
  window.addEventListener('resize', function () {
    if (window.innerWidth > 960) closeMenu();
  });
})();
</script>

</body>
</html>
