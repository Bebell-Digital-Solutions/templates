    <style>
        body {
            background-color: #ffffff;
            overflow-x: hidden;
        }

        /* 
         * Card Gallery Styling
         * Manages the fanned layout, aspect ratio, and dual-layered hover effects.
         */
        .gallery-container {
            position: relative;
            width: 100%;
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 4rem;
            perspective: 1200px;
        }

        .fan-card {
            position: absolute;
            width: 220px;
            aspect-ratio: 1080 / 1350; /* Requested Aspect Ratio */
            border-radius: 16px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.25), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.4);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: 50% 80%; /* Anchor near bottom for realistic fanning */
            cursor: pointer;
        }

        .fan-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        /* Default Fanned Positions */
        .card-1 { transform: translateX(-180px) rotate(-16deg) translateY(20px); z-index: 1; }
        .card-2 { transform: translateX(-90px) rotate(-8deg) translateY(5px); z-index: 2; }
        .card-3 { transform: translateX(0px) rotate(0deg) translateY(0px); z-index: 3; box-shadow: 0 20px 40px -15px rgba(0,0,0,0.4); }
        .card-4 { transform: translateX(90px) rotate(8deg) translateY(5px); z-index: 2; }
        .card-5 { transform: translateX(180px) rotate(16deg) translateY(20px); z-index: 1; }

        /* Level 1 Hover: Spread out when hovering the container */
        .gallery-container:hover .card-1 { transform: translateX(-240px) rotate(-22deg) translateY(30px); }
        .gallery-container:hover .card-2 { transform: translateX(-120px) rotate(-11deg) translateY(10px); }
        .gallery-container:hover .card-3 { transform: translateX(0px) rotate(0deg) translateY(-10px); }
        .gallery-container:hover .card-4 { transform: translateX(120px) rotate(11deg) translateY(10px); }
        .gallery-container:hover .card-5 { transform: translateX(240px) rotate(22deg) translateY(30px); }

        /* Level 2 Hover: Focus & bring to front when hovering a specific card */
        .gallery-container .fan-card:hover {
            transform: translateX(var(--hover-x, 0)) scale(1.15) translateY(-30px) rotate(0deg) !important;
            z-index: 20;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.5);
        }

        /* Adjust specific card hover X offsets to prevent them going off-screen/overlapping awkwardly */
        .gallery-container .card-1:hover { --hover-x: -180px; }
        .gallery-container .card-2:hover { --hover-x: -90px; }
        .gallery-container .card-3:hover { --hover-x: 0px; }
        .gallery-container .card-4:hover { --hover-x: 90px; }
        .gallery-container .card-5:hover { --hover-x: 180px; }

        /* Mobile Adjustments for Gallery */
        @media (max-width: 768px) {
            .fan-card { width: 140px; }
            .gallery-container { height: 260px; }
            
            .card-1 { transform: translateX(-100px) rotate(-14deg) translateY(15px); }
            .card-2 { transform: translateX(-50px) rotate(-7deg) translateY(5px); }
            .card-3 { transform: translateX(0px) rotate(0deg) translateY(0px); }
            .card-4 { transform: translateX(50px) rotate(7deg) translateY(5px); }
            .card-5 { transform: translateX(100px) rotate(14deg) translateY(15px); }

            .gallery-container:hover .card-1, .gallery-container:hover .card-2, 
            .gallery-container:hover .card-3, .gallery-container:hover .card-4, 
            .gallery-container:hover .card-5 {
                transform: inherit; /* Disable spread on mobile */
            }
        }
    </style>
