<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coworkers Integrations Section</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 3D Perspective Container */
    .grid-perspective {
      perspective: 1100px;
    }

    .grid-plane {
      transform: rotateX(34deg);
      transform-style: preserve-3d;
    }

    /* Base Tile Styling */
    .logo-tile {
      transition:
        transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.28s ease,
        opacity 0.28s ease,
        box-shadow 0.28s ease,
        border-color 0.28s ease;
      will-change: transform, filter, opacity;
    }

    /* Bottom Row Default Blurred State */
    .logo-tile.is-blurred {
      filter: blur(4px);
      opacity: 0.45;
    }

    /* Active / Hovered State (unblurs & lifts) */
    .logo-tile:hover,
    .logo-tile.is-active {
      filter: blur(0px) !important;
      opacity: 1 !important;
      transform: translateY(-10px) translateZ(24px) scale(1.08);
      box-shadow:
        0 18px 32px -10px rgba(15, 23, 42, 0.16),
        0 4px 12px -2px rgba(15, 23, 42, 0.08);
      border-color: rgba(15, 23, 42, 0.12);
      z-index: 30;
    }

    /* Subtle color-cycle animation for the Coworkers badge icon */
    @keyframes badgeCycle {
      0%, 100% { background: linear-gradient(135deg, #4ade80, #16a34a); }
      25%      { background: linear-gradient(135deg, #f472b6, #db2777); }
      50%      { background: linear-gradient(135deg, #60a5fa, #2563eb); }
      75%      { background: linear-gradient(135deg, #a78bfa, #7c3aed); }
    }

    .badge-icon-cycle {
      animation: badgeCycle 8s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-white text-neutral-900 antialiased selection:bg-neutral-900 selection:text-white">

  <section class="relative overflow-hidden py-24 px-4 sm:px-6 lg:px-8">
    <div class="mx-auto max-w-5xl text-center">

      <!-- Heading -->
      <h2 class="text-3xl sm:text-5xl font-semibold tracking-tight text-neutral-900 leading-[1.15]">
        <span class="inline-flex items-center gap-2.5 align-middle rounded-2xl bg-neutral-900 px-3.5 py-1.5 text-white shadow-md mr-1.5">
          <!-- Animated Cap/Avatar Icon -->
          <span class="badge-icon-cycle inline-flex h-8 w-8 sm:h-9 sm:w-9 items-center justify-center rounded-xl shadow-inner">
            <svg class="h-5 w-5 text-white" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 4C7.58 4 4 7.13 4 11v2c0 .55.45 1 1 1h14c.55 0 1-.45 1-1v-2c0-3.87-3.58-7-8-7zm-6 12c0 1.66 2.69 3 6 3s6-1.34 6-3H6z"/>
            </svg>
          </span>
          <span class="tracking-tight">Coworkers</span>
        </span>
        <span>work with your</span>
        <br class="hidden sm:block" />
        <span>tools, </span>
        <span class="text-neutral-400 font-medium">even your internal ones.</span>
      </h2>
      
      
      
      

      <!-- 3D Perspective Logo Grid -->
      <div class="grid-perspective relative mt-10 sm:mt-14 mx-auto max-w-4xl">
        <!-- Soft bottom fade overlay -->
        <div
          class="pointer-events-none absolute inset-x-0 bottom-0 h-20 bg-gradient-to-t from-white via-white/70 to-transparent z-10"
          aria-hidden="true"
        ></div>

        <div
          id="integrations-grid"
          class="grid-plane grid grid-cols-4 sm:grid-cols-8 gap-3 sm:gap-4 px-2 py-6"
        >
          <!-- Tiles injected via JavaScript -->
        </div>
      </div>

      <!-- Footer Caption -->
      <p class="mt-4 text-sm sm:text-base text-neutral-400">
        <strong class="font-semibold text-neutral-600">3,000+ integrations,</strong>
        and your own tools through MCP or API.
      </p>

    </div>
  </section>
  
  
  
  
  
  
  
  
  
  

  <script>
    // 24 integrations matching the 3x8 grid in the video
    // Using Simple Icons CDN for crisp, authentic brand logos
    const integrations = [
      // Row 1 (Sharp)
      { name: "Gmail",           icon: "https://cdn.simpleicons.org/gmail/EA4335",          row: 1 },
      { name: "Slack",           icon: "https://cdn.brandfetch.io/idJ_HhtG0Z/w/400/h/400/theme/dark/icon.jpeg?c=1dxbfHSJFAPEGdCLU4o5B",          row: 1 },
      { name: "Notion",          icon: "https://cdn.simpleicons.org/notion/000000",         row: 1 },
      { name: "Stripe",          icon: "https://cdn.simpleicons.org/stripe/635BFF",         row: 1 },
      { name: "HubSpot",         icon: "https://cdn.simpleicons.org/hubspot/FF7A59",        row: 1 },
      { name: "Google Calendar", icon: "https://cdn.simpleicons.org/googlecalendar/4285F4", row: 1 },
      { name: "LinkedIn",        icon: "https://cdn.simpleicons.org/linkedin/0A66C2",       row: 1 },
      { name: "Shopify",         icon: "https://cdn.simpleicons.org/shopify/7AB55C",        row: 1 },

      // Row 2 (Sharp)
      { name: "X",               icon: "https://cdn.simpleicons.org/x/000000",              row: 2 },
      { name: "Instagram",       icon: "https://cdn.simpleicons.org/instagram/E4405F",      row: 2 },
      { name: "YouTube",         icon: "https://cdn.simpleicons.org/youtube/FF0000",        row: 2 },
      { name: "WhatsApp",        icon: "https://cdn.simpleicons.org/whatsapp/25D366",       row: 2 },
      { name: "Figma",           icon: "https://cdn.simpleicons.org/figma/F24E1E",          row: 2 },
      { name: "Outlook",         icon: "https://cdn.simpleicons.org/microsoftoutlook/0078D4", row: 2 },
      { name: "Google Drive",    icon: "https://cdn.simpleicons.org/googledrive/4285F4",    row: 2 },
      { name: "GitHub",          icon: "https://cdn.simpleicons.org/github/181717",         row: 2 },

      // Row 3 (Blurred by default, unblurs on hover)
      { name: "Facebook",        icon: "https://cdn.simpleicons.org/facebook/0866FF",       row: 3 },
      { name: "Discord",         icon: "https://cdn.simpleicons.org/discord/5865F2",        row: 3 },
      { name: "TikTok",          icon: "https://cdn.simpleicons.org/tiktok/000000",         row: 3 },
      { name: "Zapier",          icon: "https://cdn.simpleicons.org/zapier/FF4F00",         row: 3 },
      { name: "WordPress",       icon: "https://cdn.simpleicons.org/wordpress/21759B",      row: 3 },
      { name: "Airtable",        icon: "https://cdn.simpleicons.org/airtable/18BFFF",       row: 3 },
      { name: "Google Sheets",   icon: "https://cdn.simpleicons.org/googlesheets/34A853",   row: 3 },
      { name: "Dropbox",         icon: "https://cdn.simpleicons.org/dropbox/0061FF",        row: 3 },
    ];

    const grid = document.getElementById("integrations-grid");

    integrations.forEach((item) => {
      const tile = document.createElement("button");
      tile.type = "button";
      tile.setAttribute("aria-label", item.name);
      tile.title = item.name;

      const blurClass = item.row === 3 ? "is-blurred" : "";

      tile.className = `
        logo-tile ${blurClass}
        group relative flex aspect-square items-center justify-center
        rounded-2xl bg-white border border-neutral-200/80
        shadow-[0_6px_16px_-6px_rgba(15,23,42,0.08)]
        cursor-pointer focus:outline-none focus:ring-2 focus:ring-neutral-900/20
      `;

      tile.innerHTML = `
        <img
          src="${item.icon}"
          alt="${item.name}"
          loading="lazy"
          class="h-7 w-7 sm:h-8 sm:w-8 object-contain pointer-events-none select-none transition-transform duration-200 group-hover:scale-110"
        />
      `;

      // Touch & keyboard support for unblurring/lifting
      tile.addEventListener("focus", () => tile.classList.add("is-active"));
      tile.addEventListener("blur", () => tile.classList.remove("is-active"));

      grid.appendChild(tile);
    });
  </script>
</body>
</html>
